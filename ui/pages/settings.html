<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceHandler</title>
    <link rel="stylesheet" href="css/style.css">
    <script>if (sessionStorage._navFromApp === 'true') { document.write('<style>.title, #pill, .hero-buttons { opacity: 1 !important; transform: none !important; }</style>'); document.documentElement.dataset.navFromApp = 'true'; sessionStorage._navFromApp = ''; }</script>
</head>
<body>
    <div class="page">
        <div class="hero">
            <h1 class="title init-hidden"><a href="https://www.github.com/LorenBll/ServiceHandler" target="_blank" class="title-link">ServiceHandler</a></h1>
            <div class="pill-row">
                <div class="pill init-hidden" id="pill">
                    <div class="pill-item"><span class="pill-label">bind address</span><span class="pill-value">--</span></div>
                    <div class="pill-item"><span class="pill-label">hostname</span><span class="pill-value">--</span></div>
                    <div class="pill-item"><span class="pill-label">port</span><span class="pill-value">--</span></div>
                    <div class="pill-item"><span class="pill-label">status</span><span class="pill-value">--</span></div>
                    <div class="pill-item"><span class="pill-label">registered clients</span><span class="pill-value">--</span></div>
                </div>
            </div>
            <div class="hero-buttons init-hidden">
                <button class="health-decoration home-btn" data-label="Home">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10"/></svg>
                </button>
                <button class="health-decoration settings-btn is-active" data-label="Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
        </div>
        <div class="settings-card init-hidden" id="settingsCard">
            <div style="display:flex;align-items:center;gap:6px;font-size:0.95rem;font-weight:600;margin-bottom:6px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Auto-Protect</div>
            <div style="font-size:0.7rem;color:#6b7280;line-height:1.4">The services in this list, when registering with said name, will be automatically marked as protected.</div>
            <div class="settings-card-tag-input-row">
                <input type="text" id="autoProtectInput" placeholder="Add service name..." />
                <span id="autoProtectAddBtn" style="cursor:pointer;color:#6b7280;display:flex;align-items:center;transition:color 0.1s ease" onmouseover="this.style.color='#374151'" onmouseout="this.style.color='#6b7280'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
            </div>
            <div class="settings-card-tags" id="autoProtectTags"></div>
        </div>
        <div class="settings-card init-hidden" id="settingsCard2">
            <div style="display:flex;align-items:center;gap:6px;font-size:0.95rem;font-weight:600;margin-bottom:6px"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>Auto-Restart</div>
            <div style="font-size:0.7rem;color:#6b7280;line-height:1.4">The services in this list, when failing a health check, will be automatically restarted.</div>
            <div class="settings-card-tag-input-row">
                <input type="text" id="autoRestartInput" placeholder="Add service name..." />
                <span id="autoRestartAddBtn" style="cursor:pointer;color:#6b7280;display:flex;align-items:center;transition:color 0.1s ease" onmouseover="this.style.color='#374151'" onmouseout="this.style.color='#6b7280'"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>
            </div>
            <div class="settings-card-tags" id="autoRestartTags"></div>
        </div>
        <div class="init-hidden" id="shutdownStrip" style="display:flex;justify-content:flex-start;margin-top:18px;gap:10px;">
            <button id="shutdownButton" class="shutdown-btn" style="display:flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid #d1d5db;border-radius:999px;background:#f9fafb;cursor:pointer;color:#dc2626;font-family:inherit;font-size:0.8rem;transition:background 0.1s ease;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="8" width="16" height="12" rx="1"/><path d="M8 8V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v4"/><line x1="6" y1="16" x2="6" y2="20"/><line x1="10" y1="15" x2="10" y2="20"/><line x1="14" y1="16" x2="14" y2="20"/><line x1="18" y1="15" x2="18" y2="20"/></svg>
                Shut Down ServiceHandler
            </button>
            <button id="restartButton" class="restart-btn" style="display:flex;align-items:center;gap:8px;padding:10px 20px;border:1px solid #d1d5db;border-radius:999px;background:#f9fafb;cursor:pointer;color:#2563eb;font-family:inherit;font-size:0.8rem;transition:background 0.1s ease;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                Restart ServiceHandler
            </button>
        </div>
    </div>
    <script>
        function item(label, value, cls) {
            var c = cls ? ' class="pill-item ' + cls + '"' : ' class="pill-item"';
            var html = '<div' + c + '>';
            html += '<span class="pill-label">' + label + '</span>';
            html += '<span class="pill-value">' + value + '</span>';
            html += '</div>';
            return html;
        }

        function triggerLoadInAnimation() {
            var items = [];
            var navFromApp = document.documentElement.dataset.navFromApp === 'true';
            var delayShift = navFromApp ? -0.30 : 0;

            if (navFromApp) {
                var skipEls = [document.querySelector('.title'), document.getElementById('pill'), document.querySelector('.hero-buttons')];
                skipEls.forEach(function(el) {
                    if (el) { el.classList.remove('init-hidden'); el.classList.remove('load-in'); el.style.animationDelay = ''; }
                });
            } else {
                items.push({ el: document.querySelector('.title'), delay: 0 });
                items.push({ el: document.getElementById('pill'), delay: 0.15 });
                items.push({ el: document.querySelector('.hero-buttons'), delay: 0.30 });
            }
            items.push({ el: document.getElementById('shutdownStrip'), delay: 0.90 + delayShift });
            items.push({ el: document.getElementById('settingsCard'), delay: 0.60 + delayShift });
            items.push({ el: document.getElementById('settingsCard2'), delay: 0.75 + delayShift });
            requestAnimationFrame(function() {
                items.forEach(function(item) {
                    if (!item.el) return;
                    if (item.el.classList.contains('hidden')) return;
                    if (item.el.style.display === 'none') return;
                    if (!item.el.offsetParent) return;
                    item.el.style.animationDelay = item.delay + 's';
                    item.el.classList.remove('init-hidden');
                    item.el.classList.add('load-in');
                    item.el.addEventListener('animationend', function() {
                        this.classList.remove('load-in');
                        this.style.animationDelay = '';
                    }, { once: true });
                });
            });
        }

        function flashTagDuplicate(container, name) {
            var tags = container.querySelectorAll('.settings-card-tag');
            for (var i = 0; i < tags.length; i++) {
                var text = tags[i].querySelector('span');
                if (text && text.textContent.trim() === name) {
                    tags[i].classList.remove('duplicate');
                    void tags[i].offsetWidth;
                    tags[i].classList.add('duplicate');
                    tags[i].addEventListener('animationend', function() {
                        this.classList.remove('duplicate');
                    }, { once: true });
                    break;
                }
            }
        }

        function isDuplicate(container, name) {
            var tags = container.querySelectorAll('.settings-card-tag');
            for (var i = 0; i < tags.length; i++) {
                var text = tags[i].querySelector('span');
                if (text && text.textContent.trim() === name) return true;
            }
            return false;
        }

        function addAutoProtectService(name) {
            if (!name) return false;
            var container = document.getElementById('autoProtectTags');
            if (isDuplicate(container, name)) {
                flashTagDuplicate(container, name);
                return false;
            }
            fetch('/api/settings/auto-protect', {
                method: 'GET'
            }).then(function(r) { return r.json(); }).then(function(d) {
                var updated = d.services.concat([name]).sort();
                return fetch('/api/settings/auto-protect', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({services: updated})
                });
            }).then(function(r) { if (r) return r.json(); }).then(function(d) {
                if (d) renderAutoProtectTags(d.services);
            }).catch(function() {});
            return true;
        }

        function flashInputError(input) {
            input.classList.remove('input-error');
            void input.offsetWidth;
            input.classList.add('input-error');
            setTimeout(function() {
                input.classList.remove('input-error');
            }, 1250);
        }

        function renderAutoProtectTags(services) {
            services.sort();
            var container = document.getElementById('autoProtectTags');
            container.innerHTML = '';
            if (services.length === 0) {
                var emptyEl = document.createElement('div');
                emptyEl.className = 'settings-card-empty';
                emptyEl.textContent = 'No Auto-Protected Services';
                container.appendChild(emptyEl);
                return;
            }
            services.forEach(function(name) {
                var tag = document.createElement('div');
                tag.className = 'settings-card-tag';
                tag.innerHTML = '<span>' + name + '</span><span class="settings-card-tag-x" data-name="' + name.replace(/"/g, '&quot;') + '"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>';
                container.appendChild(tag);
            });
            container.querySelectorAll('.settings-card-tag-x').forEach(function(x) {
                x.addEventListener('click', function() {
                    var name = this.getAttribute('data-name');
                    fetch('/api/settings/auto-protect', {
                        method: 'GET'
                    }).then(function(r) { return r.json(); }).then(function(d) {
                        var updated = d.services.filter(function(s) { return s !== name; });
                        return fetch('/api/settings/auto-protect', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({services: updated})
                        });
                    }).then(function(r) { return r.json(); }).then(function(d) {
                        renderAutoProtectTags(d.services);
                    }).catch(function() {});
                });
            });
        }

        function addAutoRestartService(name) {
            if (!name) return false;
            var container = document.getElementById('autoRestartTags');
            if (isDuplicate(container, name)) {
                flashTagDuplicate(container, name);
                return false;
            }
            fetch('/api/settings/auto-restart', {
                method: 'GET'
            }).then(function(r) { return r.json(); }).then(function(d) {
                var updated = d.services.concat([name]).sort();
                return fetch('/api/settings/auto-restart', {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({services: updated})
                });
            }).then(function(r) { if (r) return r.json(); }).then(function(d) {
                if (d) renderAutoRestartTags(d.services);
            }).catch(function() {});
            return true;
        }

        function renderAutoRestartTags(services) {
            services.sort();
            var container = document.getElementById('autoRestartTags');
            container.innerHTML = '';
            if (services.length === 0) {
                var emptyEl = document.createElement('div');
                emptyEl.className = 'settings-card-empty';
                emptyEl.textContent = 'No Auto-Restart Services';
                container.appendChild(emptyEl);
                return;
            }
            services.forEach(function(name) {
                var tag = document.createElement('div');
                tag.className = 'settings-card-tag';
                tag.innerHTML = '<span>' + name + '</span><span class="settings-card-tag-x" data-name="' + name.replace(/"/g, '&quot;') + '"><svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>';
                container.appendChild(tag);
            });
            container.querySelectorAll('.settings-card-tag-x').forEach(function(x) {
                x.addEventListener('click', function() {
                    var name = this.getAttribute('data-name');
                    fetch('/api/settings/auto-restart', {
                        method: 'GET'
                    }).then(function(r) { return r.json(); }).then(function(d) {
                        var updated = d.services.filter(function(s) { return s !== name; });
                        return fetch('/api/settings/auto-restart', {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({services: updated})
                        });
                    }).then(function(r) { return r.json(); }).then(function(d) {
                        renderAutoRestartTags(d.services);
                    }).catch(function() {});
                });
            });
        }

        document.getElementById('autoProtectInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var val = this.value.trim();
                if (!val) { flashInputError(this); return; }
                if (addAutoProtectService(val)) this.value = '';
            } else if (e.key === 'Escape') {
                this.blur();
            }
        });

        document.getElementById('autoProtectAddBtn').addEventListener('click', function() {
            var input = document.getElementById('autoProtectInput');
            var val = input.value.trim();
            if (!val) { flashInputError(input); return; }
            if (addAutoProtectService(val)) input.value = '';
            input.focus();
        });

        document.getElementById('autoRestartInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                var val = this.value.trim();
                if (!val) { flashInputError(this); return; }
                if (addAutoRestartService(val)) this.value = '';
            } else if (e.key === 'Escape') {
                this.blur();
            }
        });

        document.getElementById('autoRestartAddBtn').addEventListener('click', function() {
            var input = document.getElementById('autoRestartInput');
            var val = input.value.trim();
            if (!val) { flashInputError(input); return; }
            if (addAutoRestartService(val)) input.value = '';
            input.focus();
        });

        document.addEventListener('click', function(e) {
            var apInput = document.getElementById('autoProtectInput');
            var arInput = document.getElementById('autoRestartInput');
            if (e.target !== apInput && e.target.id !== 'autoProtectAddBtn') {
                apInput.blur();
            }
            if (e.target !== arInput && e.target.id !== 'autoRestartAddBtn') {
                arInput.blur();
            }
        });

        document.querySelector('.home-btn').addEventListener('click', function() {
            sessionStorage._navFromApp = 'true';
            document.body.classList.add('page-exit');
            setTimeout(function() { window.location.href = '/'; }, 100);
        });

        document.getElementById('shutdownButton').addEventListener('click', function() {
            fetch('/api/shutdown', { method: 'POST' }).catch(function() {});
        });

        document.getElementById('restartButton').addEventListener('click', function() {
            fetch('/api/restart', { method: 'POST' }).catch(function() {});
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.id !== 'autoProtectInput' && e.target.id !== 'autoRestartInput') {
                e.preventDefault();
                return;
            }
        });

        fetch('/api/health')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                document.getElementById('pill').innerHTML =
                    item('bind address', d.bind_address) +
                    item('hostname', d.hostname) +
                    item('port', d.port) +
                    item('pid', d.pid) +
                    (d.status === 'ok' ? item('status', d.status.toUpperCase(), 'status-ok') : item('status', d.status.toUpperCase(), 'status-error')) +
                    item('registered clients', d.registered_clients);
                if (d.status !== 'ok') {
                    document.body.classList.add('has-error');
                }
                fetch('/api/settings/auto-protect').then(function(r) { return r.json(); }).then(function(d) { renderAutoProtectTags(d.services); }).catch(function() {});
                fetch('/api/settings/auto-restart').then(function(r) { return r.json(); }).then(function(d) { renderAutoRestartTags(d.services); }).catch(function() {});
                triggerLoadInAnimation();
            })
            .catch(function() {
                document.getElementById('pill').innerHTML =
                    item('bind address', 'error') +
                    item('hostname', 'error') +
                    item('port', 'error') +
                    item('pid', 'error') +
                    item('status', 'ERROR', 'status-error') +
                    item('registered clients', 'error');
                triggerLoadInAnimation();
            });
    </script>
</body>
</html>
