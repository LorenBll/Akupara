<section class="page-content" data-admin="{{ 'true' if is_admin else 'false' }}" data-root="{{ 'true' if is_root else 'false' }}">
    <h2 class="page-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>Settings</h2>
    <div class="card-indicator-list" id="cardIndicatorList" aria-label="Cards">
        {% for card in card_indicators %}
        <span class="card-indicator" data-card-id="{{ card.id }}" data-card-title="{{ card.title }}" data-card-role="{{ card.role }}"{% if card.hidden %} hidden{% endif %}>
            {{ card.icon|safe }}
            <span class="card-indicator-title">{{ card.title }}</span>
        </span>
        {% endfor %}
    </div>
    {% for card in card_indicators %}
    {% if card.role == 'all' or is_admin %}
    <div class="card-slot" id="card-slot-{{ card.id }}" data-card-id="{{ card.id }}" data-card-role="{{ card.role }}"{% if card.hidden %} hidden{% endif %}>
        <div class="card-slot-loading" hidden><span class="update-spinner" aria-hidden="true"></span></div>
    </div>
    {% endif %}
    {% endfor %}
    {% if is_admin %}
    <div class="page-actions">
        <button class="page-action-btn terminate" data-action="terminate">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v5"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 22v-5"/><path d="M14 19v-2"/><path d="M18 20v-3"/><path d="M2 13h20"/><path d="M6 20v-3"/></svg>
            Terminate Akupara
        </button>
        <button class="page-action-btn restart" data-action="restart">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Restart Akupara
        </button>
    </div>
    {% endif %}
</section>
