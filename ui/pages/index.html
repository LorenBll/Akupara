<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Akupara</title>
    <link rel="stylesheet" href="/ui/css/index.css?v=3">
</head>
<body>
    <header class="page-header">
        <h1 class="title init-hidden"><a href="https://www.github.com/LorenBll/Akupara" target="_blank" rel="noopener" class="title-link"><img src="/ui/icons/akupara.svg" alt="" class="title-icon">Akupara</a></h1>
        <div class="pill init-hidden">
            <div class="pill-row">
                <div class="pill-item"><span class="pill-label">HOSTNAME</span><span class="pill-value" data-field="hostname">--</span></div>
                <div class="pill-item"><span class="pill-label">BIND ADDRESS</span><span class="pill-value" data-field="bind_address">--</span></div>
                <div class="pill-item"><span class="pill-label">PORT</span><span class="pill-value" data-field="port">--</span></div>
                <div class="pill-item"><span class="pill-label">PID</span><span class="pill-value" data-field="pid">--</span></div>
                <div class="pill-item"><span class="pill-label">STATUS</span><span class="pill-value pill-value-emphasis" data-field="status">--</span></div>
                <div class="pill-item"><span class="pill-label">RUNNING PLUGINS</span><span class="pill-value" data-field="registered_plugins">--</span></div>
            </div>
            <div class="separator"></div>
            <div class="pill-row pill-actions">
                    <button class="pill-action-btn" aria-label="Home" data-page="home" data-label="Home">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10"/></svg>
                    </button>
                    <button class="pill-action-btn" aria-label="Settings" data-page="settings" data-label="Settings">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                    {% if is_admin %}
                    <button class="pill-action-btn" aria-label="Plugins" data-page="plugins" data-label="Plugins">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.39 4.39a1 1 0 0 0 1.68-.474 2.5 2.5 0 1 1 3.014 3.015 1 1 0 0 0-.474 1.68l1.683 1.682a2.414 2.414 0 0 1 0 3.414L19.61 15.39a1 1 0 0 1-1.68-.474 2.5 2.5 0 1 0-3.014 3.015 1 1 0 0 1 .474 1.68l-1.683 1.682a2.414 2.414 0 0 1-3.414 0L8.61 19.61a1 1 0 0 0-1.68.474 2.5 2.5 0 1 1-3.014-3.015 1 1 0 0 0 .474-1.68l-1.683-1.682a2.414 2.414 0 0 1 0-3.414L4.39 8.61a1 1 0 0 1 1.68.474 2.5 2.5 0 1 0 3.014-3.015 1 1 0 0 1-.474-1.68l1.683-1.682a2.414 2.414 0 0 1 3.414 0z"/></svg>
                    </button>
                    {% endif %}
                </div>
        </div>
    </header>

    <main class="view" id="view"></main>

    <footer class="page-footer" id="pageFooter">
        Report issues <a href="https://www.github.com/LorenBll/Akupara/issues" target="_blank" rel="noopener">here</a> · Created by <a href="https://www.github.com/LorenBll" target="_blank" rel="noopener">LorenBll</a>
    </footer>

    <div class="floating-tooltip" id="sliderTooltip" hidden></div>

    <div class="floating-tooltip" id="sectionTooltip" hidden></div>

    <div class="floating-tooltip" id="tableTooltip" hidden></div>

    <div class="floating-tooltip error-tooltip" id="errorTooltip" hidden></div>

    <script src="/ui/js/argon2/argon2-bundled.min.js"></script>
    <script>
        function triggerLoadIn() {
            var items = [
                { el: document.querySelector('.title'), delay: 0.3 },
                { el: document.querySelector('.pill'), delay: 0.45 }
            ];

            requestAnimationFrame(function() {
                items.forEach(function(item) {
                    if (!item.el) return;
                    item.el.style.animationDelay = item.delay + 's';
                    item.el.classList.remove('init-hidden');
                    item.el.classList.add('load-in');
                    item.el.addEventListener('animationend', function() {
                        this.classList.remove('load-in');
                        this.style.animationDelay = '';
                    }, { once: true });
                });
            });
        }

        triggerLoadIn();

        function fetchWithHandshake(url, options) {
            options = options || {};
            options.credentials = 'same-origin';
            return fetch(url, options).then(function (r) {
                if (r.status === 401) {
                    window.location.href = '/login';
                }
                return r;
            });
        }

        function populatePill() {
            fetch('/api/health')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    ['hostname', 'bind_address', 'port', 'pid', 'status'].forEach(function (key) {
                        if (data[key] == null) return;
                        var els = document.querySelectorAll('.pill-value[data-field="' + key + '"]');
                        Array.prototype.forEach.call(els, function (el) {
                            if (key === 'status') {
                                var value = String(data[key]).toUpperCase();
                                el.textContent = value;
                                el.classList.remove('pill-value-ok', 'pill-value-bad');
                                el.classList.add(value === 'OK' ? 'pill-value-ok' : 'pill-value-bad');
                            } else {
                                el.textContent = data[key];
                            }
                        });
                    });
                })
                .catch(function () {});
        }

        populatePill();

        var viewEl = document.getElementById('view');
        var pageButtons = Array.prototype.slice.call(document.querySelectorAll('.pill-action-btn'));
        var isFirstLoad = true;

        function setActivePage(page) {
            currentPage = page;
            pageButtons.forEach(function (btn) {
                btn.disabled = btn.getAttribute('data-page') === page;
            });
        }

        function loadPage(page) {
            hideSliderTooltip();
            hideSectionTooltip();
            hideErrorTooltip();
            animateCardIndicatorsOut();
            var keysReq = Promise.resolve(null);
            fetchWithHandshake('/ui/pages/' + page + '.html')
                .then(function (r) {
                    if (!r.ok) throw new Error('Failed to load ' + page);
                    return Promise.all([r.text(), keysReq]);
                })
                .then(function (results) {
                    setTimeout(function () {
                        var html = results[0];
                        var keysData = results[1];
                        if (html.indexOf('loginForm') !== -1) {
                            window.location.href = '/login';
                            return;
                        }
                        viewEl.innerHTML = html;
                        var content = viewEl.firstElementChild;
                        var loadInDelay = 0;
                        if (content) {
                        if (isFirstLoad) {
                            content.style.animationDelay = '0.6s';
                            loadInDelay = 600;
                        }
                        content.classList.add('load-in');
                        content.addEventListener('animationend', function () {
                            this.classList.remove('load-in');
                            this.style.animationDelay = '';
                        }, { once: true });
                    }
                    isFirstLoad = false;
                    setActivePage(page);
                    if (page === 'settings') {
                        fetchSettings();
                        wireToggleTooltips();
                        wireApiKeyGenerator();
                        wireApiKeysTable();
                        wireAccountSection();
                        wireLogout();
                        wireUpdateButtons();
 wireSoundDropdowns();
                        wireAudioSoundDropdowns();
                        wireSharedVariableGenerator();
                        wireSharedMemoryTable();
                        wireUserRegistration();
                        var usersTbody = document.getElementById('usersTableBody');
                        if (usersTbody && usersTbody.dataset.users) {
                            try {
                                usersList = JSON.parse(usersTbody.dataset.users);
                            } catch (e) {
                                usersList = [];
                            }
                        }
                        currentUsername = (usersTbody && usersTbody.dataset.current) || '';
                        legacyUsername = (usersTbody && usersTbody.dataset.legacy) || '';
                        var roleEl = document.getElementById('accountRoleValue');
                        lastSessionAdmin = roleEl ? roleEl.dataset.admin === 'true' : false;
                        currentSessionRoot = roleEl ? roleEl.dataset.root === 'true' : false;
                        rebuildRegisteredUsernames();
                        renderUsersTable(usersList);
                        wireUsersTable();
                        loadUsers();
                        var sharedTbody = document.getElementById('sharedMemoryTableBody');
                        if (sharedTbody && sharedTbody.dataset.variables) {
                            try {
                                sharedVariablesList = JSON.parse(sharedTbody.dataset.variables);
                                renderSharedMemoryTable(sharedVariablesList);
                            } catch (e) {}
                        }
                        loadSharedMemory();
                        var emptyEl = document.getElementById('apiKeysEmpty');
                        if (emptyEl) emptyEl.hidden = true;
                        var keysTbody = document.getElementById('apiKeysTableBody');
                        var rendered = false;
                        if (keysData && Array.isArray(keysData.apiKeys)) {
                            apiKeysList = keysData.apiKeys.slice();
                            renderApiKeysTable(apiKeysList);
                            rendered = true;
                        } else if (keysTbody && keysTbody.dataset.keys) {
                            try {
                                apiKeysList = JSON.parse(keysTbody.dataset.keys);
                                renderApiKeysTable(apiKeysList);
                                rendered = true;
                            } catch (e) {}
                        }
                        if (!rendered) loadApiKeys();
                        var netTbody = document.getElementById('networkAccessTableBody');
                        if (netTbody && netTbody.dataset.networkAccessIps) {
                            try {
                                networkAccessIpsList = JSON.parse(netTbody.dataset.networkAccessIps);
                                renderNetworkAccessTable(networkAccessIpsList);
                            } catch (e) {}
                        }
                        wireNetworkAccessTable();
                        wireNetworkAccessInsert();
                        loadNetworkAccessIps();
                    }
                    buildCardIndicators();
                        animateCardIndicatorsIn(loadInDelay);
                    }, 200);
                })
                .catch(function () {
                    viewEl.innerHTML = '<p>Failed to load page: ' + page + '</p>';
                });
        }

        pageButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                loadPage(btn.getAttribute('data-page'));
            });
        });

        function postAction(url) {
            fetchWithHandshake(url, { method: 'POST' })
                .then(function (r) { return r.json(); })
                .catch(function () {});
        }

        var apiKeysList = [];
        var sharedVariablesList = [];
        var networkAccessIpsList = [];
        var usersList = [];
        var currentUsername = '';
        var legacyUsername = '';
        var currentPage = '';
        var lastSessionAdmin = false;
        var currentSessionRoot = false;
        var registeredUsernames = [];

        function rebuildRegisteredUsernames() {
            var names = usersList.map(function (u) { return u.username; });
            if (legacyUsername) names.push(legacyUsername);
            registeredUsernames = names;
        }

        function isUsernameTaken(username, excludeName) {
            var u = String(username || '').trim().toLowerCase();
            if (!u) return false;
            return registeredUsernames.some(function (name) {
                if (excludeName && String(name).toLowerCase() === String(excludeName).toLowerCase()) return false;
                return String(name).toLowerCase() === u;
            });
        }

        function isApiKeyNameTaken(name, excludeKey) {
            var n = String(name || '').trim().toLowerCase();
            if (!n) return false;
            return apiKeysList.some(function (k) {
                if (excludeKey && k.key === excludeKey) return false;
                return String(k.name).toLowerCase() === n;
            });
        }

        function refreshApiKeyInputInvalid(input) {
            var taken = isApiKeyNameTaken(input.value, input.dataset.excludeKey);
            if (!input._flashTimer) {
                input.classList.toggle('api-key-input-invalid', taken);
            }
            if (!taken) {
                hideErrorTooltip();
            } else {
                showErrorTooltip(input, 'That name is already taken.');
            }
        }

        function flashApiKeyInputRed(input) {
            if (input.classList.contains('api-key-input-invalid')) return;
            if (input._flashTimer) clearTimeout(input._flashTimer);
            input.classList.remove('api-key-input-invalid');
            void input.offsetWidth;
            input.classList.add('api-key-input-invalid');
            input._flashTimer = setTimeout(function () {
                input._flashTimer = null;
                refreshApiKeyInputInvalid(input);
            }, 600);
        }

        function refreshApiKeyGenerateBtn() {
            var input = document.getElementById('apiKeyNameInput');
            var btn = document.getElementById('generateApiKeyBtn');
            if (!input || !btn) return;
            var name = input.value.trim();
            btn.disabled = name === '' || isApiKeyNameTaken(name);
        }

        function wireApiKeyGenerator() {
            var input = document.getElementById('apiKeyNameInput');
            if (!input) return;
            input.addEventListener('keydown', function (event) {
                if (event.key.length === 1 && /[ ,;\\/:%]/.test(event.key)) {
                    event.preventDefault();
                    flashApiKeyInputRed(this);
                }
            });
            input.addEventListener('input', function () {
                var before = this.value;
                this.value = this.value.replace(/[ ,;\\/:%]/g, '');
                if (this.value !== before) {
                    flashApiKeyInputRed(this);
                }
                refreshApiKeyInputInvalid(this);
                refreshApiKeyGenerateBtn();
            });
            refreshApiKeyGenerateBtn();
        }

        function generateApiKey() {
            var input = document.getElementById('apiKeyNameInput');
            if (!input) return;
            var name = input.value.trim();
            if (!name) {
                flashApiKeyInputRed(input);
                showErrorTooltip(input, 'Name cannot be empty.');
                return;
            }
            if (isApiKeyNameTaken(name)) {
                flashApiKeyInputRed(input);
                showErrorTooltip(input, 'That name is already taken.');
                return;
            }
            fetchWithHandshake('/api/api-keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.key === 'string') {
                        input.value = '';
                        refreshApiKeyInputInvalid(input);
                        refreshApiKeyGenerateBtn();
                        hideErrorTooltip();
                        loadApiKeys();
                    }
                })
                .catch(function () {});
        }

        var RANDOM_API_KEY_NAMES = ['personal', 'work', 'home', 'backup', 'server', 'dev', 'production', 'staging', 'automation', 'monitoring', 'reporting', 'sync', 'cli', 'mobile', 'web', 'test', 'data', 'notifications'];

        function randomApiKeyName() {
            var taken = {};
            apiKeysList.forEach(function (k) {
                taken[String(k.name).toLowerCase()] = true;
            });
            var pool = RANDOM_API_KEY_NAMES.slice();
            while (pool.length) {
                var idx = Math.floor(Math.random() * pool.length);
                var name = pool.splice(idx, 1)[0];
                if (!taken[name.toLowerCase()]) return name;
            }
            var base = 'api-key';
            var n = 2;
            while (taken[base.toLowerCase()]) {
                base = 'api-key-' + n;
                n++;
            }
            return base;
        }

        function randomizeApiKeyName() {
            var input = document.getElementById('apiKeyNameInput');
            if (!input) return;
            input.value = randomApiKeyName();
            refreshApiKeyInputInvalid(input);
            refreshApiKeyGenerateBtn();
            input.focus();
        }

        var ICONS = {
            eye: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>',
            eyeOff: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>',
            pen: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>',
            save: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>',
            trash: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
            copy: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
            check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        };

        var tableTooltip = document.getElementById('tableTooltip');
        var tableTooltipTimer = null;

        function censorKey(key) {
            if (!key) return '';
            var visible = Math.ceil(key.length * 2 / 6);
            if (visible >= key.length) return '*'.repeat(key.length);
            return key.slice(0, visible) + '*'.repeat(key.length - visible);
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try {
                    document.execCommand('copy');
                    resolve();
                } catch (err) {
                    reject(err);
                }
                document.body.removeChild(ta);
            });
        }

        function showTableTooltip(text, target, side) {
            tableTooltip.textContent = text;
            tableTooltip.hidden = false;
            var t = tableTooltip.getBoundingClientRect();
            var row = target.closest('tr');
            var rowRect = row ? row.getBoundingClientRect() : target.getBoundingClientRect();
            var r = target.getBoundingClientRect();
            var top = Math.round(rowRect.top + rowRect.height / 2 - t.height / 2);
            var left;
            if (side === 'left') {
                left = Math.round(r.left - t.width - 8);
                if (left < 8) left = Math.round(r.right + 8);
            } else {
                left = Math.round(r.right + 8);
            }
            tableTooltip.style.left = left + 'px';
            tableTooltip.style.top = top + 'px';
        }

        function hideTableTooltip() {
            tableTooltip.hidden = true;
        }

        function showErrorTooltip(target, message) {
            var tooltip = document.getElementById('errorTooltip');
            if (!tooltip || !target || !message) return;
            tooltip.textContent = message;
            tooltip.hidden = false;
            var tooltipRect = tooltip.getBoundingClientRect();
            var r = target.getBoundingClientRect();
            tooltip.style.left = Math.round(r.left + r.width / 2 - tooltipRect.width / 2) + 'px';
            tooltip.style.top = Math.round(r.top - tooltipRect.height - 8) + 'px';
        }

        function hideErrorTooltip() {
            var tooltip = document.getElementById('errorTooltip');
            if (tooltip) tooltip.hidden = true;
        }

        function loadApiKeys() {
            if (!document.getElementById('apiKeysTableBody')) return;
            fetchWithHandshake('/api/api-keys')
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data || !Array.isArray(data.apiKeys)) return;
                    apiKeysList = data.apiKeys.slice();
                    renderApiKeysTable(data.apiKeys);
                })
                .catch(function () {});
        }

        function loadSharedMemory() {
            if (!document.getElementById('sharedMemoryTableBody')) return;
            fetchWithHandshake('/api/shared-memory')
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data || !Array.isArray(data.sharedMemory)) return;
                    sharedVariablesList = data.sharedMemory.slice();
                    renderSharedMemoryTable(data.sharedMemory);
                })
                .catch(function () {});
        }

        function isSharedVariableNameTaken(n) {
            if (!n) return false;
            var lower = String(n).toLowerCase();
            return sharedVariablesList.some(function (v) {
                return String(v.name).toLowerCase() === lower;
            });
        }

        function isSharedVariableNameValid(n) {
            return typeof n === 'string' && n.trim() !== '' && !/[ ,;\\/:%]/.test(n);
        }

        function flashSharedVariableInvalid(el) {
            if (el.classList.contains('api-key-input-invalid')) return;
            if (el._flashTimer) clearTimeout(el._flashTimer);
            el.classList.remove('api-key-input-invalid');
            void el.offsetWidth;
            el.classList.add('api-key-input-invalid');
            el._flashTimer = setTimeout(function () {
                el._flashTimer = null;
                el.classList.remove('api-key-input-invalid');
            }, 600);
        }

        function updateSharedVariableInputs() {
            var nameInput = document.getElementById('sharedVariableNameInput');
            var typeDropdown = document.getElementById('sharedVariableTypeDropdown');
            var valueInput = document.getElementById('sharedVariableValueInput');
            var booleanDropdown = document.getElementById('sharedVariableBooleanDropdown');
            if (!nameInput || !typeDropdown || !valueInput || !booleanDropdown) return;

            var nameValid = isSharedVariableNameValid(nameInput.value);
            var typeBtn = getSoundDropdownButton(typeDropdown);
            if (typeBtn) typeBtn.disabled = !nameValid;
            var typeSelected = getSoundDropdownValue(typeDropdown) !== '';
            valueInput.disabled = !nameValid || !typeSelected;
            var booleanBtn = getSoundDropdownButton(booleanDropdown);
            if (booleanBtn) booleanBtn.disabled = !nameValid || !typeSelected;
            var boolean = getSoundDropdownValue(typeDropdown) === 'boolean';
            valueInput.hidden = boolean;
            booleanDropdown.hidden = !boolean;
            var addBtn = document.getElementById('addSharedVariableBtn');
            if (addBtn) addBtn.disabled = !isSharedVariableFormReady();
        }

        function isSharedVariableFormReady() {
            var nameInput = document.getElementById('sharedVariableNameInput');
            var typeDropdown = document.getElementById('sharedVariableTypeDropdown');
            var valueInput = document.getElementById('sharedVariableValueInput');
            var booleanDropdown = document.getElementById('sharedVariableBooleanDropdown');
            if (!nameInput || !typeDropdown || !valueInput || !booleanDropdown) return false;
            if (!isSharedVariableNameValid(nameInput.value)) return false;
            if (isSharedVariableNameTaken(nameInput.value)) return false;
            var type = getSoundDropdownValue(typeDropdown);
            if (!type) return false;
            if (type === 'boolean') return getSoundDropdownValue(booleanDropdown) !== '';
            if (type === 'integer' || type === 'float') return valueInput.value.trim() !== '';
            return true;
        }

        function isSharedValueCharAllowed(ch, type) {
            if (type === 'integer') return /[0-9-]/.test(ch);
            if (type === 'float') return /[0-9.-]/.test(ch);
            return true;
        }

        function wireSharedVariableGenerator() {
            var nameInput = document.getElementById('sharedVariableNameInput');
            var typeDropdown = document.getElementById('sharedVariableTypeDropdown');
            var valueInput = document.getElementById('sharedVariableValueInput');
            var booleanDropdown = document.getElementById('sharedVariableBooleanDropdown');
            var addBtn = document.getElementById('addSharedVariableBtn');
            if (!nameInput || !typeDropdown || !valueInput || !booleanDropdown || !addBtn) return;

            nameInput.addEventListener('keydown', function (event) {
                if (event.key.length === 1 && /[ ,;\\/:%]/.test(event.key)) {
                    event.preventDefault();
                    flashSharedVariableInvalid(this);
                }
            });
            nameInput.addEventListener('input', function () {
                var before = this.value;
                this.value = this.value.replace(/[ ,;\\/:%]/g, '');
                if (this.value !== before) {
                    flashSharedVariableInvalid(this);
                }
                var taken = isSharedVariableNameTaken(this.value);
                this.classList.toggle('api-key-input-invalid', taken);
                if (taken) {
                    showErrorTooltip(this, 'That name is already taken.');
                } else {
                    hideErrorTooltip();
                }
                updateSharedVariableInputs();
            });

            typeDropdown._onSelect = function () {
                var typeBtn = getSoundDropdownButton(typeDropdown);
                var booleanBtn = getSoundDropdownButton(booleanDropdown);
                if (typeBtn) typeBtn.classList.remove('api-key-input-invalid');
                valueInput.classList.remove('api-key-input-invalid');
                if (booleanBtn) booleanBtn.classList.remove('api-key-input-invalid');
                valueInput.value = '';
                resetSoundDropdown(booleanDropdown);
                updateSharedVariableInputs();
                hideErrorTooltip();
            };

            booleanDropdown._onSelect = function () {
                var booleanBtn = getSoundDropdownButton(booleanDropdown);
                if (booleanBtn) booleanBtn.classList.remove('api-key-input-invalid');
                updateSharedVariableInputs();
                hideErrorTooltip();
            };

            valueInput.addEventListener('keydown', function (event) {
                var type = getSoundDropdownValue(typeDropdown);
                if (event.key.length === 1 && !isSharedValueCharAllowed(event.key, type)) {
                    event.preventDefault();
                    flashSharedVariableInvalid(this);
                }
            });
            valueInput.addEventListener('input', function () {
                var type = getSoundDropdownValue(typeDropdown);
                var before = this.value;
                var filtered = this.value.split('').filter(function (ch) { return isSharedValueCharAllowed(ch, type); }).join('');
                if (filtered !== before) {
                    this.value = filtered;
                    flashSharedVariableInvalid(this);
                }
                updateSharedVariableInputs();
                hideErrorTooltip();
            });

            addBtn.addEventListener('click', addSharedVariable);
            updateSharedVariableInputs();
        }

        function addSharedVariable() {
            var nameInput = document.getElementById('sharedVariableNameInput');
            var typeDropdown = document.getElementById('sharedVariableTypeDropdown');
            var valueInput = document.getElementById('sharedVariableValueInput');
            var booleanDropdown = document.getElementById('sharedVariableBooleanDropdown');
            if (!nameInput || !typeDropdown || !valueInput || !booleanDropdown) return;

            var name = nameInput.value.trim();
            var type = getSoundDropdownValue(typeDropdown);

            if (!name || /[ ,;\\/:%]/.test(name)) {
                flashSharedVariableInvalid(nameInput);
                showErrorTooltip(nameInput, 'Enter a valid name.');
                return;
            }
            if (isSharedVariableNameTaken(name)) {
                flashSharedVariableInvalid(nameInput);
                showErrorTooltip(nameInput, 'That name is already taken.');
                return;
            }
            if (!type) {
                flashSharedVariableInvalid(getSoundDropdownButton(typeDropdown));
                showErrorTooltip(getSoundDropdownButton(typeDropdown), 'Select a type.');
                return;
            }

            var value;
            if (type === 'boolean') {
                var booleanValue = getSoundDropdownValue(booleanDropdown);
                if (booleanValue === '') {
                    flashSharedVariableInvalid(getSoundDropdownButton(booleanDropdown));
                    showErrorTooltip(getSoundDropdownButton(booleanDropdown), 'Select a value.');
                    return;
                }
                value = booleanValue === 'true';
            } else {
                var rawValue = valueInput.value;
                if (rawValue === '') {
                    if (type === 'string') value = '';
                    else if (type === 'list') value = [];
                    else if (type === 'dictionary') value = {};
                    else {
                        flashSharedVariableInvalid(valueInput);
                        showErrorTooltip(valueInput, 'A value is required for this type.');
                        return;
                    }
                } else {
                    try {
                        if (type === 'string') {
                            value = rawValue;
                        } else if (type === 'integer') {
                            if (!/^-?\d+$/.test(rawValue)) throw new Error('invalid integer');
                            value = parseInt(rawValue, 10);
                        } else if (type === 'float') {
                            if (!/^-?\d+(\.\d+)?$/.test(rawValue)) throw new Error('invalid float');
                            value = parseFloat(rawValue);
                        } else if (type === 'list' || type === 'dictionary') {
                            value = JSON.parse(rawValue);
                        } else {
                            value = rawValue;
                        }
                    } catch (e) {
                        flashSharedVariableInvalid(valueInput);
                        showErrorTooltip(valueInput, 'Invalid value for this type.');
                        return;
                    }
                }
            }

            fetchWithHandshake('/api/shared-memory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, type: type, value: value })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.name === 'string') {
                        nameInput.value = '';
                        resetSoundDropdown(typeDropdown);
                        valueInput.value = '';
                        resetSoundDropdown(booleanDropdown);
                        updateSharedVariableInputs();
                        hideErrorTooltip();
                        loadSharedMemory();
                    }
                })
                .catch(function () {});
        }

        function serializeSharedValue(value, type) {
            if (type === 'boolean') return value ? 'true' : 'false';
            if (type === 'list' || type === 'dictionary') {
                try { return JSON.stringify(value); } catch (e) { return ''; }
            }
            if (value === '' || value == null) return '';
            return String(value);
        }

        function parseSharedValueInput(rawValue, type) {
            if (rawValue === '') {
                if (type === 'string') return '';
                if (type === 'list') return [];
                if (type === 'dictionary') return {};
                throw new Error('A value is required for this type.');
            }
            if (type === 'string') return rawValue;
            if (type === 'integer') {
                if (!/^-?\d+$/.test(rawValue)) throw new Error('Invalid integer value.');
                return parseInt(rawValue, 10);
            }
            if (type === 'float') {
                if (!/^-?\d+(\.\d+)?$/.test(rawValue)) throw new Error('Invalid float value.');
                return parseFloat(rawValue);
            }
            if (type === 'list' || type === 'dictionary') {
                return JSON.parse(rawValue);
            }
            throw new Error('Unknown type.');
        }

        function sharedMemoryPatchHeaders() {
            var headers = { 'Content-Type': 'application/json' };
            if (apiKeysList.length > 0) {
                headers['X-Api-Key'] = apiKeysList[0].key;
            }
            return headers;
        }

        function buildInlineDropdown(options, selectedValue, onChange) {
            var wrapper = document.createElement('div');
            wrapper.className = 'sound-dropdown inline-dropdown';
            wrapper._onSelect = onChange;

            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'sound-select';
            btn.setAttribute('aria-haspopup', 'listbox');
            btn.setAttribute('aria-expanded', 'false');

            var valueSpan = document.createElement('span');
            valueSpan.className = 'sound-select-value';
            valueSpan.setAttribute('data-value', selectedValue || '');
            var arrow = document.createElement('span');
            arrow.className = 'sound-select-arrow';
            arrow.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';

            var menu = document.createElement('ul');
            menu.className = 'sound-select-menu';
            menu.setAttribute('role', 'listbox');

            var selectedLabel = '';
            options.forEach(function (opt) {
                if (opt.value === selectedValue) selectedLabel = opt.label;
                var li = document.createElement('li');
                li.className = 'sound-select-option' + (opt.value === selectedValue ? ' selected' : '');
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', opt.value === selectedValue ? 'true' : 'false');
                li.setAttribute('data-value', opt.value);
                var label = document.createElement('span');
                label.className = 'sound-select-option-label';
                label.textContent = opt.label;
                var check = document.createElement('span');
                check.className = 'sound-select-check';
                check.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
                li.appendChild(label);
                li.appendChild(check);
                menu.appendChild(li);
            });
            valueSpan.textContent = selectedLabel;

            btn.appendChild(valueSpan);
            btn.appendChild(arrow);
            wrapper.appendChild(btn);
            wrapper.appendChild(menu);
            return wrapper;
        }

        function renderSharedValueEditor(row) {
            var valueTd = row.querySelector('.shared-var-value-cell');
            if (!valueTd) return;
            var type = row.dataset.type;
            var current = row.dataset.value || '';
            valueTd.innerHTML = '';
            if (type === 'boolean') {
                var dropdown = buildInlineDropdown([
                    { value: 'true', label: 'true' },
                    { value: 'false', label: 'false' }
                ], current === 'true' || current === 'false' ? current : 'true', function (val) {
                    row.dataset.value = val;
                });
                valueTd.appendChild(dropdown);
            } else {
                var input = document.createElement('input');
                input.type = 'text';
                input.className = 'api-key-name-input-edit';
                input.value = current;
                input.addEventListener('input', function () {
                    var t = row.dataset.type;
                    var before = this.value;
                    var filtered = this.value.split('').filter(function (ch) { return isSharedValueCharAllowed(ch, t); }).join('');
                    if (filtered !== before) {
                        this.value = filtered;
                        flashSharedVariableInvalid(this);
                    }

        function renderSharedTypeEditor(row) {
            var typeTd = row.querySelector('.shared-var-type-cell');

            typeTd.innerHTML = '';
            var dropdown = buildInlineDropdown([
                { value: 'string', label: 'string' },
                { value: 'list', label: 'list' },
                { value: 'dictionary', label: 'dictionary' },
                { value: 'integer', label: 'integer' },
                { value: 'float', label: 'float' },
                { value: 'boolean', label: 'boolean' }
            ], currentType, function (newType) {
                if (newType && newType !== row.dataset.type) {
                    row.dataset.type = newType;
                    row.dataset.value = '';
                    renderSharedValueEditor(row);

                renderSharedTypeLabel(row);

        function exitSharedEdit(row, btn, updated) {
            row.dataset.editing = '0';
            row.dataset.type = updated.type;

            btn.innerHTML = ICONS.pen;

            var valueTd = row.querySelector('.shared-var-value-cell');

        function saveSharedEdit(row, btn) {
            var name = row.dataset.name;
            var type = row.dataset.type;
            var valueTd = row.querySelector('.shared-var-value-cell');
            var value;
            if (type === 'boolean') {
                var dropdown = valueTd.querySelector('.sound-dropdown');
                var bv = dropdown ? getSoundDropdownValue(dropdown) : '';
                if (bv === '') {
                    if (dropdown) {
                        flashSharedVariableInvalid(getSoundDropdownButton(dropdown));
                        showErrorTooltip(getSoundDropdownButton(dropdown), 'Select a value.');
                    }
                    return;
                }
                value = bv === 'true';
            } else {
                var input = valueTd.querySelector('input');
                var rawValue = input ? input.value : '';
                try {
                    value = parseSharedValueInput(rawValue, type);
                } catch (e) {
                    if (input) {
                        flashSharedVariableInvalid(input);
                        showErrorTooltip(input, 'Invalid value for this type.');
                    }
                    return;
                }
            }
            fetchWithHandshake('/api/shared-memory/' + encodeURIComponent(name), {
                method: 'PATCH',
                headers: sharedMemoryPatchHeaders(),
                body: JSON.stringify({ type: type, value: value })
            })
                .then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (data) {
                        return { ok: r.ok, data: data };
                    });
                })
                .then(function (res) {
                    if (!res.ok) return;
                    var data = res.data;
                    if (data && typeof data.name === 'string') {
                        sharedVariablesList = sharedVariablesList.map(function (v) {
                            return v.name === name ? data : v;
                        });
                        hideErrorTooltip();
                        exitSharedEdit(row, btn, data);
                    } else {
                        row.dataset.editing = '0';
                        btn.innerHTML = ICONS.pen;
                        btn.dataset.tableTooltip = 'Edit Variable';
                        var typeTd = row.querySelector('.shared-var-type-cell');
                        var valueTd = row.querySelector('.shared-var-value-cell');
                        if (typeTd) typeTd.textContent = row.dataset.type;
                        if (valueTd) valueTd.textContent = row.dataset.value;
                        hideTableTooltip();
                        hideErrorTooltip();
                    }
                })
                .catch(function () {});
        }

        function deleteSharedVariable(name, btn) {
            var row = btn.closest('tr');
            var table = row.closest('table');
            var wrap = row.closest('.table-wrap');
            var tbody = row.closest('tbody');
            var isLast = tbody ? tbody.children.length === 1 : false;
            var below = getRowsBelow(row);
            var firstTops = below.map(function (e) { return e.getBoundingClientRect().top; });
            var h1 = wrap ? wrap.offsetHeight : 0;
            hideTableTooltip();
            var rect = row.getBoundingClientRect();
            var overlay = document.createElement('div');
            overlay.className = 'api-key-row-overlay';
            overlay.style.left = Math.round(rect.left) + 'px';
            overlay.style.top = Math.round(rect.top) + 'px';
            overlay.style.width = Math.round(rect.width) + 'px';
            overlay.style.height = Math.round(rect.height) + 'px';
            document.body.appendChild(overlay);
            void overlay.offsetWidth;
            overlay.classList.add('api-key-row-overlay-active');
            row.classList.add('api-key-row-deleting');
            if (isLast && table) table.classList.add('api-keys-table-deleting');
            setTimeout(function () {
                fetchWithHandshake('/api/shared-memory/' + encodeURIComponent(name), { method: 'DELETE' })
                    .then(function (r) { return r.json(); })
                    .catch(function () {});
                overlay.remove();
                sharedVariablesList = sharedVariablesList.filter(function (v) { return v.name !== name; });
                row.remove();

                    renderSharedMemoryTable([]);

                        wrap.style.height = '';

                    }, 400);
                }
            }, 1050);
        }

        function wireSharedMemoryTable() {
            var table = document.getElementById('sharedMemoryTable');

                var btn = event.target.closest('[data-action]');

                    if (row && row.dataset.editing === '1') {

                        enterSharedEdit(row, btn);

                if (el.disabled) return;

            table.addEventListener('mouseout', function (event) {
                var el = event.target.closest('[data-table-tooltip]');

                if (to && el.contains(to)) return;

        function isValidIpv4(s) {
            if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(s)) return false;
            return s.split('.').every(function (octet) {
                return parseInt(octet, 10) <= 255;

        function isValidIpv6(s) {
            if (!s || s.length < 2 || !/^[0-9a-fA-F:.]+$/.test(s)) return false;
            var hasV4 = s.indexOf('.') !== -1;
            if (hasV4) {
                var v4match = s.match(/^([0-9a-fA-F:]*):(\d{1,3}(?:\.\d{1,3}){3})$/);
                if (!v4match || !isValidIpv4(v4match[2])) return false;
                s = v4match[1] + ':x';
            }
            if (s === '::') return true;
            var doubleColons = (s.match(/::/g) || []).length;
            if (doubleColons > 1) return false;
            var maxGroups = hasV4 ? 7 : 8;
            if (doubleColons === 1) {
                var parts = s.split('::');
                if (parts.length > 2) return false;
                var total = 0;
                for (var p = 0; p < 2; p++) {
                    var part = parts[p];
                    if (!part) continue;
                    if (part.charAt(0) === ':' || part.charAt(part.length - 1) === ':') return false;
                    var gs = part.split(':');
                    for (var g = 0; g < gs.length; g++) {
                        if (!/^[0-9a-fA-F]{1,4}$/.test(gs[g])) return false;
                        total++;
                    }
                }
                return total >= 1 && total < maxGroups;
            }
            var groups = s.split(':');
            if (groups.length !== maxGroups) return false;
            for (var i = 0; i < groups.length; i++) {
                if (!/^[0-9a-fA-F]{1,4}$/.test(groups[i])) return false;
            }
            return true;
        }

        function isValidIp(s) {
            s = String(s || '').trim();
            if (!s) return false;
            return s.indexOf('.') !== -1 ? isValidIpv4(s) : isValidIpv6(s);

        function maximizeIpv6(ip) {

                for (var i = 0; i < segs.length; i++) {
                    if (segs[i].indexOf('.') !== -1) {
                        var hex = '';

                        for (var j = 0; j < octs.length; j++) {
                            hex += ('0' + parseInt(octs[j], 10).toString(16)).slice(-2);
                        }

                    } else {

                    }
                }

            }
            var left = groupsOf(halves[0]);
            var right = halves.length > 1 ? groupsOf(halves[1]) : [];
            var zeros = 8 - left.length - right.length;
            var full = left.slice();
            for (var z = 0; z < zeros; z++) full.push('0000');
            return full.concat(right).join(':');
        }

        function wireUserRegistration() {
            var usernameInput = document.getElementById('registerUsernameInput');
            var passwordInput = document.getElementById('registerPasswordInput');
            var confirmInput = document.getElementById('registerConfirmInput');
            var registerBtn = document.getElementById('registerUserBtn');
            if (!usernameInput || !passwordInput || !confirmInput || !registerBtn) return;

            var SALT = 'akupara-salt';
            var PARAMS = { time: 2, mem: 65536, hashLen: 32, parallelism: 1, type: argon2.ArgonType.Argon2id };
            var busy = false;

            function hashPassword(password) {
                var options = { pass: password, salt: SALT };
                for (var key in PARAMS) options[key] = PARAMS[key];
                return argon2.hash(options).then(function (result) {
                    return result.encoded;
                });
            }

            function markInvalid(input, invalid) {
                input.classList.toggle('account-password-input-invalid', invalid);
            }

            function markPersistent(input) {
                if (input._flashTimer) { clearTimeout(input._flashTimer); input._flashTimer = null; }
                input.classList.add('account-password-input-invalid');
            }

            function flashInvalid(input) {
                if (input.classList.contains('account-password-input-invalid')) return;
                if (input._flashTimer) clearTimeout(input._flashTimer);
                input.classList.remove('account-password-input-invalid');
                void input.offsetWidth;
                input.classList.add('account-password-input-invalid');
                input._flashTimer = setTimeout(function () {
                    input._flashTimer = null;
                    input.classList.remove('account-password-input-invalid');
                }, 600);
            }

            function refreshRegisterUsernameInvalid() {
                var username = usernameInput.value.trim();
                var invalid = username !== '' && (username.length < 8 || isUsernameTaken(username));
                markInvalid(usernameInput, invalid);
                if (!invalid) {
                    hideErrorTooltip();
                } else if (username.length < 8) {
                    showErrorTooltip(usernameInput, 'Username must be at least 8 characters long.');
                } else {
                    showErrorTooltip(usernameInput, 'That username is already registered.');
                }
            }

            function sync() {
                var usernameHas = usernameInput.value.trim().length > 0;
                var passwordHas = passwordInput.value.length > 0;
                if (!passwordHas) {
                    confirmInput.value = '';
                    confirmInput.disabled = true;
                } else {
                    confirmInput.disabled = busy;
                }
                var confirmHas = confirmInput.value.length > 0;
                registerBtn.disabled = busy || !(usernameHas && passwordHas && confirmHas);
            }

            var seg = document.getElementById('registerAdminSegmented');
            if (seg) {
                seg.addEventListener('click', function (event) {
                    var btn = event.target.closest('.network-access-segment');
                    if (!btn) return;
                    Array.prototype.forEach.call(seg.querySelectorAll('.network-access-segment'), function (b) {
                        b.classList.toggle('selected', b === btn);
                    });
                });
            }

            usernameInput.addEventListener('keydown', function (event) {
                if (event.key.length === 1 && /[ ,;\\/:%]/.test(event.key)) {
                    event.preventDefault();
                    flashInvalid(this);
                }
            });
            usernameInput.addEventListener('input', function () {
                var before = this.value;
                this.value = this.value.replace(/[ ,;\\/:%]/g, '');
                if (this.value !== before) {
                    flashInvalid(this);
                }
                refreshRegisterUsernameInvalid();
                sync();
            });
            passwordInput.addEventListener('input', function () {
                confirmInput.value = '';
                markInvalid(passwordInput, false);
                markInvalid(confirmInput, false);
                hideErrorTooltip();
                sync();
            });
            confirmInput.addEventListener('input', function () {
                markInvalid(confirmInput, false);
                hideErrorTooltip();
                sync();
            });

            registerBtn.addEventListener('click', function () {
                if (busy) return;
                var username = usernameInput.value.trim();
                var password = passwordInput.value;
                if (!username) {
                    markPersistent(usernameInput);
                    showErrorTooltip(usernameInput, 'Enter a username.');
                    usernameInput.focus();
                    return;
                }
                if (username.length < 8) {
                    markPersistent(usernameInput);
                    showErrorTooltip(usernameInput, 'Username must be at least 8 characters long.');
                    usernameInput.focus();
                    return;
                }
                if (isUsernameTaken(username)) {
                    markPersistent(usernameInput);
                    showErrorTooltip(usernameInput, 'That username is already registered.');
                    usernameInput.focus();
                    return;
                }
                if (password !== confirmInput.value) {
                    markPersistent(confirmInput);
                    showErrorTooltip(confirmInput, 'Passwords do not match.');
                    confirmInput.focus();
                    return;
                }
                var selected = seg ? seg.querySelector('.network-access-segment.selected') : null;
                var admin = selected ? selected.dataset.value === 'true' : false;
                busy = true;
                sync();
                hashPassword(password)
                    .then(function (passwordHash) {
                        return fetchWithHandshake('/api/users', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username: username, password_hash: passwordHash, admin: admin })
                        });
                    })
                    .then(function (r) {
                        return r.json().catch(function () { return {}; }).then(function (data) {
                            return { status: r.status, data: data };
                        });
                    })
                    .then(function (res) {
                        busy = false;
                        if (res.status === 201) {
                            usernameInput.value = '';
                            passwordInput.value = '';
                            confirmInput.value = '';
                            markInvalid(usernameInput, false);
                            markInvalid(passwordInput, false);
                            markInvalid(confirmInput, false);
                            hideErrorTooltip();
                            loadUsers();
                        } else if (res.status === 409 || res.status === 400) {
                            markPersistent(usernameInput);
                            showErrorTooltip(usernameInput, (res.data && res.data.error) || 'Failed to register the user.');
                            usernameInput.focus();
                        }
                        sync();
                    })
                    .catch(function () {
                        busy = false;
                        sync();
                    });
            });

            sync();
        }

        function wireAccountSection() {
            var currentInput = document.getElementById('currentPasswordInput');
            var newInput = document.getElementById('newPasswordInput');
            var confirmInput = document.getElementById('confirmPasswordInput');
            var changeBtn = document.getElementById('changePasswordBtn');
            if (!currentInput || !newInput || !confirmInput || !changeBtn) return;

            var SALT = 'akupara-salt';
            var PARAMS = { time: 2, mem: 65536, hashLen: 32, parallelism: 1, type: argon2.ArgonType.Argon2id };
            var busy = false;

            function hashPassword(password) {
                var options = { pass: password, salt: SALT };
                for (var key in PARAMS) options[key] = PARAMS[key];
                return argon2.hash(options).then(function (result) {
                    return result.encoded;
                });
            }

            function markInvalid(input, invalid) {
                input.classList.toggle('account-password-input-invalid', invalid);
            }

            function syncChaining() {
                var currentHas = currentInput.value.length > 0;
                var newHas = newInput.value.length > 0;
                if (!currentHas) newInput.value = '';
                newInput.disabled = busy || !currentHas;
                if (!currentHas || !newHas) confirmInput.value = '';
                confirmInput.disabled = busy || !currentHas || !newHas;
                changeBtn.disabled = busy || !(currentHas && newHas && confirmInput.value.length > 0);
            }

            currentInput.addEventListener('input', function () {
                newInput.value = '';
                confirmInput.value = '';
                markInvalid(currentInput, false);
                markInvalid(newInput, false);
                markInvalid(confirmInput, false);
                hideErrorTooltip();
                syncChaining();
            });
            newInput.addEventListener('input', function () {
                markInvalid(newInput, false);
                hideErrorTooltip();
                syncChaining();
            });
            confirmInput.addEventListener('input', function () {
                markInvalid(confirmInput, false);
                hideErrorTooltip();
                syncChaining();
            });

            changeBtn.addEventListener('click', function () {
                if (busy) return;
                markInvalid(currentInput, false);
                markInvalid(confirmInput, false);
                if (newInput.value !== confirmInput.value) {
                    markInvalid(confirmInput, true);
                    showErrorTooltip(confirmInput, 'Passwords do not match.');
                    confirmInput.focus();
                    return;
                }
                busy = true;
                syncChaining();
                Promise.all([hashPassword(currentInput.value), hashPassword(newInput.value)])
                    .then(function (hashes) {
                        return fetchWithHandshake('/api/change-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ current_password_hash: hashes[0], new_password_hash: hashes[1] })
                        });
                    })
                    .then(function (r) {
                        return r.json().catch(function () { return {}; }).then(function (data) {
                            return { status: r.status, data: data };
                        });
                    })
                    .then(function (res) {
                        busy = false;
                        if (res.status === 200) {
                            currentInput.value = '';
                            newInput.value = '';
                            confirmInput.value = '';
                            markInvalid(currentInput, false);
                            markInvalid(newInput, false);
                            markInvalid(confirmInput, false);
                            hideErrorTooltip();
                        } else if (res.status === 403) {
                            markInvalid(currentInput, true);
                            showErrorTooltip(currentInput, 'Current password is incorrect.');
                            currentInput.focus();
                        }
                        syncChaining();
                    })
                    .catch(function () {
                        busy = false;
                        syncChaining();
                    });
            });

            syncChaining();
        }

        function setUpdateButtonState(isUpdateAvailable) {

            if (!btn) return;
            if (isUpdateAvailable) {
                btn.textContent = 'Update Now';
                btn.dataset.mode = 'update';
                // Update Now is not network callable → disabled unless localhost
                if (!isLocalhost()) {
                    btn.disabled = true;
                    btn.title = 'Available only from localhost';
                } else {
                    btn.disabled = false;
                    btn.removeAttribute('title');
                }
            } else {
                btn.textContent = 'Check for Updates';
                btn.dataset.mode = 'check';
                btn.disabled = false;
                btn.removeAttribute('title');

        function checkForUpdates() {
            var btn = document.getElementById('checkForUpdatesBtn');
            if (!btn) return;
            btn.disabled = true;
            var prevText = btn.textContent;
            btn.textContent = 'Checking...';
            fetchWithHandshake('/api/check-for-updates', { method: 'POST' })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && data.updateAvailable === true) {
                        setUpdateButtonState(true);
                    } else {
                        setUpdateButtonState(false);
                    }
                })
                .catch(function () {
                    btn.textContent = prevText;
                    btn.disabled = false;
                    if (btn.dataset.mode === 'update' && !isLocalhost()) {
                        btn.disabled = true;

        function morphAllowNewIcons(value) {
            var toggle = document.getElementById('networkAccessAllowNewToggle');
            if (!toggle) return;
            toggle.classList.toggle('on', value);
            toggle.setAttribute('aria-checked', value ? 'true' : 'false');
            var lock = toggle.querySelector('.toggle-lock');
            var open = toggle.querySelector('.toggle-lock-open');
            if (!lock || !open) return;
            var lockFrom, lockTo, openFrom, openTo;
            if (value) {
                lockFrom = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
                lockTo = { opacity: '0', transform: 'scale(0.3) rotate(45deg)' };
                openFrom = { opacity: '0', transform: 'scale(0.3) rotate(-45deg)' };
                openTo = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
            } else {
                lockFrom = { opacity: '0', transform: 'scale(0.3) rotate(45deg)' };
                lockTo = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
                openFrom = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
                openTo = { opacity: '0', transform: 'scale(0.3) rotate(-45deg)' };
            }
            var opts = { duration: 300, easing: 'ease', fill: 'forwards' };
            if (lock.getAnimations) lock.getAnimations().forEach(function (a) { a.cancel(); });
            if (open.getAnimations) open.getAnimations().forEach(function (a) { a.cancel(); });
            lock.animate([lockFrom, lockTo], opts);
            open.animate([openFrom, openTo], opts);
        }

        var cardHideTimers = {};

        function getBelow(card) {
            var els = [];
            var el = card.nextElementSibling;
            while (el) {
                els.push(el);
                el = el.nextElementSibling;
            }
            return els;
        }

        function flipBelow(below, first) {
            var last = below.map(function (e) { return e.getBoundingClientRect().top; });
            below.forEach(function (e, i) {
                e.style.transition = 'none';
                e.style.transform = 'translateY(' + (first[i] - last[i]) + 'px)';
            });
            void document.body.offsetWidth;
            below.forEach(function (e, i) {
                e.style.transition = 'transform 0.5s ease';
                e.style.transform = 'translateY(0)';
            });
            setTimeout(function () {
                below.forEach(function (e) {
                    e.style.transition = '';
                    e.style.transform = '';
                });
            }, 500);
        }

        function revealCard(card) {
            var below = getBelow(card);
            var first = below.map(function (e) { return e.getBoundingClientRect().top; });
            var id = card.id;
            if (cardHideTimers[id]) {
                clearTimeout(cardHideTimers[id]);
                cardHideTimers[id] = null;
            }
            card.hidden = false;
            card.classList.remove('api-keys-vanish', 'api-keys-reveal');
            void card.offsetWidth;
            card.classList.add('api-keys-reveal');
            flipBelow(below, first);
            cardIndicatorAppear(card);
        }

        function hideCard(card) {
            if (!card || card.hidden) return;
            cardIndicatorVanish(card);
            var id = card.id;
            card.classList.remove('api-keys-reveal', 'api-keys-vanish');
            void card.offsetWidth;
            card.classList.add('api-keys-vanish');
            if (cardHideTimers[id]) clearTimeout(cardHideTimers[id]);
            cardHideTimers[id] = setTimeout(function () {
                cardHideTimers[id] = null;
                var below = getBelow(card);
                var first = below.map(function (e) { return e.getBoundingClientRect().top; });
                card.classList.remove('api-keys-vanish');
                card.hidden = true;
                flipBelow(below, first);
            }, 400);
        }

        var cardIndicatorList = null;

        function getCardIndicatorList() {

        function positionCardIndicators() {

            if (!cardIndicatorList.firstChild) {
                cardIndicatorList.style.right = '';
                cardIndicatorList.style.left = '';
                cardIndicatorList.style.top = '';

            }
            var rect = viewEl.getBoundingClientRect();
            var viewportW = window.innerWidth || document.documentElement.clientWidth;
            cardIndicatorList.style.left = 'auto';
            cardIndicatorList.style.right = (viewportW - rect.left + 24) + 'px';
            cardIndicatorList.style.top = rect.top + 'px';
