<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Akupara</title>
    <link rel="stylesheet" href="/ui/css/index.css?v=5">
    <script>
        try {
            if (localStorage.getItem('akupara-dev-stripes-hidden') === 'true') {
                document.documentElement.classList.add('dev-stripes-prehidden');
            }
            var storedTheme = localStorage.getItem('akupara-theme');
            var initialTheme = storedTheme === 'dark' || storedTheme === 'light'
                ? storedTheme
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            document.documentElement.setAttribute('data-theme', initialTheme);
        } catch (e) {}
    </script>
    <style>
        .dev-stripes-prehidden .dev-stripe { opacity: 0 !important; transition: none !important; }
    </style>
</head>
<body>
    {% if development %}
    <div class="dev-stripe dev-stripe-left" aria-hidden="true"></div>
    <div class="dev-stripe dev-stripe-right" aria-hidden="true"></div>
    {% endif %}
    <script>
        try {
            if (localStorage.getItem('akupara-dev-stripes-hidden') === 'true') {
                document.querySelectorAll('.dev-stripe').forEach(function(s){ s.classList.add('faded'); });
            }
            // Re-enable transition after initial paint
            requestAnimationFrame(function(){
                document.documentElement.classList.remove('dev-stripes-prehidden');
            });
        } catch (e) {}
    </script>
    <header class="page-header">
        <h1 class="title init-hidden"><a href="https://www.github.com/LorenBll/Akupara" target="_blank" rel="noopener" class="title-link"><img src="/ui/icons/akupara.svg" alt="" class="title-icon">Akupara</a></h1>
        <div class="pill init-hidden">
            <div class="pill-row">
                <div class="pill-item"><span class="pill-label">HOSTNAME</span><span class="pill-value" data-field="hostname">--</span></div>
                <div class="pill-item"><span class="pill-label">BIND ADDRESS</span><span class="pill-value" data-field="bind_address">--</span></div>
                <div class="pill-item"><span class="pill-label">PORT</span><span class="pill-value" data-field="port">--</span></div>
                <div class="pill-item"><span class="pill-label">PID</span><span class="pill-value" data-field="pid">--</span></div>
                <div class="pill-item"><span class="pill-label">STATUS</span><span class="pill-value pill-value-emphasis" data-field="status">--</span></div>
                <div class="pill-item"><span class="pill-label">RUNNING PLUGINS</span><span class="pill-value" data-field="registered_plugins">--</span></div>
            </div>
            <div class="separator"></div>
            <div class="pill-row pill-actions">
                    <button class="pill-action-btn" aria-label="Home" data-page="home" data-label="Home">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1V10"/></svg>
                    </button>
                    <button class="pill-action-btn" aria-label="Settings" data-page="settings" data-label="Settings">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                    {% if is_admin %}
                    <button class="pill-action-btn" aria-label="Plugin Marketplace" data-page="plugins" data-label="Plugin Marketplace">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    </button>
                    {% endif %}
                </div>
        </div>
    </header>

    <main class="view" id="view"></main>

    <footer class="page-footer" id="pageFooter">
        Report issues <a href="https://www.github.com/LorenBll/Akupara/issues" target="_blank" rel="noopener">here</a> · Created by <a href="https://www.github.com/LorenBll" target="_blank" rel="noopener">LorenBll</a>
    </footer>

    <div class="floating-tooltip" id="sliderTooltip" hidden></div>

    <div class="floating-tooltip" id="sectionTooltip" hidden></div>

    <div class="floating-tooltip" id="tableTooltip" hidden></div>

    <div class="floating-tooltip error-tooltip" id="errorTooltip" hidden></div>

    <div class="theme-light-afterglow" id="themeLightAfterglow" aria-hidden="true"></div>
    <div class="theme-light-progress" id="themeLightProgress" role="progressbar" aria-label="Time left Until Yellow Filter Vanishes" aria-valuemin="0" aria-valuemax="60" aria-valuenow="60">
        <div class="theme-light-progress-bar"></div>
        <span class="theme-light-progress-label"><span>Time left Until Yellow Filter Vanishes</span><span aria-hidden="true">·</span><button type="button" class="theme-light-progress-skip" id="themeLightProgressSkip">Skip</button></span>
    </div>

    <script src="/ui/js/argon2/argon2-bundled.min.js"></script>
    <script src="/ui/js/fetch.js"></script>
    <script src="/ui/js/tooltips.js"></script>
    <script src="/ui/js/validation.js"></script>
    <script>
        function triggerLoadIn() {
            var items = [
                { el: document.querySelector('.title'), delay: 0.3 },
                { el: document.querySelector('.pill'), delay: 0.45 }
            ];

            requestAnimationFrame(function() {
                items.forEach(function(item) {
                    if (!item.el) return;
                    item.el.style.animationDelay = item.delay + 's';
                    item.el.classList.remove('init-hidden');
                    item.el.classList.add('load-in');
                    item.el.addEventListener('animationend', function() {
                        this.classList.remove('load-in');
                        this.style.animationDelay = '';
                    }, { once: true });
                });
            });
        }

        triggerLoadIn();

        function fetchWithHandshake(url, options) {
            options = options || {};
            options.credentials = 'same-origin';
            return fetch(url, options).then(function (r) {
                if (r.status === 401) {
                    window.location.href = '/login';
                }
                return r;
            });
        }

        function populatePill() {
            fetch('/api/health')
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    ['hostname', 'bind_address', 'port', 'pid', 'status'].forEach(function (key) {
                        if (data[key] == null) return;
                        var els = document.querySelectorAll('.pill-value[data-field="' + key + '"]');
                        Array.prototype.forEach.call(els, function (el) {
                            if (key === 'status') {
                                var value = String(data[key]).toUpperCase();
                                el.textContent = value;
                                el.classList.remove('pill-value-ok', 'pill-value-bad');
                                el.classList.add(value === 'OK' ? 'pill-value-ok' : 'pill-value-bad');
                            } else {
                                el.textContent = data[key];
                            }
                        });
                    });
                })
                .catch(function () {});
        }

        populatePill();

        var viewEl = document.getElementById('view');
        var pageButtons = Array.prototype.slice.call(document.querySelectorAll('.pill-action-btn'));
        var isFirstLoad = true;

        function setActivePage(page) {
            currentPage = page;
            pageButtons.forEach(function (btn) {
                btn.disabled = btn.getAttribute('data-page') === page;
            });
        }

        function loadPage(page) {
            hideSliderTooltip();
            hideSectionTooltip();
            hideErrorTooltip();
            animateCardIndicatorsOut();
            var keysReq = Promise.resolve(null);
            fetchWithHandshake('/ui/pages/' + page + '.html')
                .then(function (r) {
                    if (!r.ok) throw new Error('Failed to load ' + page);
                    return Promise.all([r.text(), keysReq]);
                })
                .then(function (results) {
                    setTimeout(function () {
                        var html = results[0];
                        var keysData = results[1];
                        if (html.indexOf('loginForm') !== -1) {
                            window.location.href = '/login';
                            return;
                        }
                        viewEl.innerHTML = html;
                        var content = viewEl.firstElementChild;
                        var loadInDelay = 0;
                        if (content) {
                        if (isFirstLoad) {
                            content.style.animationDelay = '0.6s';
                            loadInDelay = 600;
                        }
                        content.classList.add('load-in');
                        content.addEventListener('animationend', function () {
                            this.classList.remove('load-in');
                            this.style.animationDelay = '';
                        }, { once: true });
                    }
                    isFirstLoad = false;
                    setActivePage(page);
                    if (page === 'settings') {
                        fetchSettings();
                        initializeThemeToggle();
                        wireToggleTooltips();
                        wireApiKeyGenerator();
                        wireApiKeysTable();
                        wireAccountSection();
                        wireLogout();
                        wireUpdateButtons();
                        wirePluginUpdateButtons();
                        wirePluginUpgradeButtons();
 wireSoundDropdowns();
                        wireAudioSoundDropdowns();
                        fetchPlayLogSounds();
                        fetchPlayStartupSound();
                        wireSharedVariableGenerator();
                        wireImportButtonTooltips();
                        wireSharedMemoryTable();
                        wireEventStreamingGenerator();
                        wireEventStreamingTable();
                        loadPluginEvents();
                        wireUserRegistration();
                        var usersTbody = document.getElementById('usersTableBody');
                        if (usersTbody && usersTbody.dataset.users) {
                            try {
                                usersList = JSON.parse(usersTbody.dataset.users);
                            } catch (e) {
                                usersList = [];
                            }
                        }
                        currentUsername = (usersTbody && usersTbody.dataset.current) || '';
                        var roleEl = document.getElementById('accountRoleValue');
                        lastSessionAdmin = roleEl ? roleEl.dataset.admin === 'true' : false;
                        currentSessionRoot = roleEl ? roleEl.dataset.root === 'true' : false;
                        rebuildRegisteredUsernames();
                        renderUsersTable(usersList);
                        wireUsersTable();
                        loadUsers();
                        var installedTbody = document.getElementById('installedPluginsTableBody');
                        if (installedTbody && installedTbody.dataset.installedPlugins) {
                            try {
                                installedPluginsList = JSON.parse(installedTbody.dataset.installedPlugins);
                            } catch (e) {
                                installedPluginsList = [];
                            }
                        }
                        renderInstalledPluginsTable(installedPluginsList);
                        wireInstalledPluginsTable();
                        loadInstalledPlugins();
                        var sharedTbody = document.getElementById('sharedMemoryTableBody');
                        if (sharedTbody && sharedTbody.dataset.variables) {
                            try {
                                sharedVariablesList = JSON.parse(sharedTbody.dataset.variables);
                                renderSharedMemoryTable(sharedVariablesList);
                            } catch (e) {}
                        }
                        loadSharedMemory();
                        var emptyEl = document.getElementById('apiKeysEmpty');
                        if (emptyEl) emptyEl.hidden = true;
                        var keysTbody = document.getElementById('apiKeysTableBody');
                        var rendered = false;
                        if (keysData && Array.isArray(keysData.apiKeys)) {
                            apiKeysList = keysData.apiKeys.slice();
                            renderApiKeysTable(apiKeysList);
                            rendered = true;
                        } else if (keysTbody && keysTbody.dataset.keys) {
                            try {
                                apiKeysList = JSON.parse(keysTbody.dataset.keys);
                                renderApiKeysTable(apiKeysList);
                                rendered = true;
                            } catch (e) {}
                        }
                        if (!rendered) loadApiKeys();
                        var netTbody = document.getElementById('externalInteractionsTableBody');
                        if (netTbody && netTbody.dataset.externalInteractionsIps) {
                            try {
                                incomingIpsList = JSON.parse(netTbody.dataset.externalInteractionsIps);
                                renderFirewallTable('incoming', incomingIpsList);
                            } catch (e) {}
                        }
                        var netOutgoingTbody = document.getElementById('externalInteractionsOutgoingTableBody');
                        if (netOutgoingTbody && netOutgoingTbody.dataset.externalInteractionsOutgoingIps) {
                            try {
                                outgoingIpsList = JSON.parse(netOutgoingTbody.dataset.externalInteractionsOutgoingIps);
                                renderFirewallTable('outgoing', outgoingIpsList);
                            } catch (e) {}
                        }
                        wireFirewallTable('incoming');
                        wireFirewallTable('outgoing');
                        loadFirewallIps('incoming');
                        loadFirewallIps('outgoing');
                        fetchExternalInteractionsAllowNew();
                        fetchExternalInteractionsAllowNewOutgoing();
                    }
                    buildCardIndicators();
                        animateCardIndicatorsIn(loadInDelay);
                    }, 200);
                })
                .catch(function () {
                    viewEl.textContent = 'Failed to load page: ' + page;
                });
        }

        pageButtons.forEach(function (btn) {
            btn.addEventListener('click', function () {
                loadPage(btn.getAttribute('data-page'));
            });
        });

        function postAction(url) {
            fetchWithHandshake(url, { method: 'POST' })
                .then(function (r) { return r.json(); })
                .catch(function () {});
        }

        var apiKeysList = [];
        var sharedVariablesList = [];
        var incomingIpsList = [];
        var outgoingIpsList = [];
        var usersList = [];
        var installedPluginsList = [];
        var currentUsername = '';
        var currentPage = '';
        var lastSessionAdmin = false;
        var currentSessionRoot = false;
        var registeredUsernames = [];
        var PLAINTEXT_PROHIBITED_RE = /[ ,;\/\\:%"']/g;
        var PLAINTEXT_PROHIBITED_TEST_RE = /[ ,;\/\\:%"']/;

        function rebuildRegisteredUsernames() {
            var names = usersList.map(function (u) { return u.username; });
            registeredUsernames = names;
        }

        function isUsernameTaken(username, excludeName) {
            var u = String(username || '').trim().toLowerCase();
            if (!u) return false;
            return registeredUsernames.some(function (name) {
                if (excludeName && String(name).toLowerCase() === String(excludeName).toLowerCase()) return false;
                return String(name).toLowerCase() === u;
            });
        }

        function isApiKeyNameTaken(name, excludeKey) {
            var n = String(name || '').trim().toLowerCase();
            if (!n) return false;
            return apiKeysList.some(function (k) {
                if (excludeKey && k.key === excludeKey) return false;
                return String(k.name).toLowerCase() === n;
            });
        }

        function refreshApiKeyInputInvalid(input) {
            var taken = isApiKeyNameTaken(input.value, input.dataset.excludeKey);
            if (!input._flashTimer) {
                input.classList.toggle('api-key-input-invalid', taken);
            }
            if (!taken) {
                hideErrorTooltip();
            } else {
                showErrorTooltip(input, 'That name is already taken.');
            }
        }

        function flashApiKeyInputRed(input) {
            if (input.classList.contains('api-key-input-invalid')) return;
            if (input._flashTimer) clearTimeout(input._flashTimer);
            input.classList.remove('api-key-input-invalid');
            void input.offsetWidth;
            input.classList.add('api-key-input-invalid');
            input._flashTimer = setTimeout(function () {
                input._flashTimer = null;
                refreshApiKeyInputInvalid(input);
            }, 600);
        }

        function refreshApiKeyGenerateBtn() {
            var input = document.getElementById('apiKeyNameInput');
            var btn = document.getElementById('generateApiKeyBtn');
            if (!input || !btn) return;
            var name = input.value.trim();
            btn.disabled = isApiKeyNameTaken(name);
        }

        function wireApiKeyGenerator() {
            var input = document.getElementById('apiKeyNameInput');
            if (!input) return;
            input.addEventListener('keydown', function (event) {
                if (event.key.length === 1 && PLAINTEXT_PROHIBITED_TEST_RE.test(event.key)) {
                    event.preventDefault();
                    flashApiKeyInputRed(this);
                }
            });
            input.addEventListener('input', function () {
                var before = this.value;
                this.value = this.value.replace(PLAINTEXT_PROHIBITED_RE, '');
                if (this.value !== before) {
                    flashApiKeyInputRed(this);
                }
                refreshApiKeyInputInvalid(this);
                refreshApiKeyGenerateBtn();
            });
            refreshApiKeyGenerateBtn();
        }

        function generateApiKey() {
            var input = document.getElementById('apiKeyNameInput');
            if (!input) return;
            var name = input.value.trim();
            if (!name) {
                showTransientError(input, 'api-key-input-invalid', 'Name is required.');
                return;
            }
            if (isApiKeyNameTaken(name)) {
                flashApiKeyInputRed(input);
                showErrorTooltip(input, 'That name is already taken.');
                return;
            }
            fetchWithHandshake('/api/api-keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.key === 'string') {
                        input.value = '';
                        refreshApiKeyInputInvalid(input);
                        refreshApiKeyGenerateBtn();
                        hideErrorTooltip();
                        loadApiKeys();
                    }
                })
                .catch(function () {});
        }

        var RANDOM_API_KEY_NAMES = ['personal', 'work', 'home', 'backup', 'server', 'dev', 'production', 'staging', 'automation', 'monitoring', 'reporting', 'sync', 'cli', 'mobile', 'web', 'test', 'data', 'notifications'];

        function randomApiKeyName() {
            var taken = {};
            apiKeysList.forEach(function (k) {
                taken[String(k.name).toLowerCase()] = true;
            });
            var pool = RANDOM_API_KEY_NAMES.slice();
            while (pool.length) {
                var idx = Math.floor(Math.random() * pool.length);
                var name = pool.splice(idx, 1)[0];
                if (!taken[name.toLowerCase()]) return name;
            }
            var base = 'api-key';
            var n = 2;
            while (taken[base.toLowerCase()]) {
                base = 'api-key-' + n;
                n++;
            }
            return base;
        }

        function randomizeApiKeyName() {
            var input = document.getElementById('apiKeyNameInput');
            if (!input) return;
            input.value = randomApiKeyName();
            refreshApiKeyInputInvalid(input);
            refreshApiKeyGenerateBtn();
            input.focus();
        }

        var ICONS = {
            eye: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>',
            eyeOff: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>',
            pen: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z"/></svg>',
            save: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"/><path d="M7 3v4a1 1 0 0 0 1 1h7"/></svg>',
            trash: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>',
            copy: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>',
            check: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        };

        var tableTooltip = document.getElementById('tableTooltip');
        var tableTooltipTimer = null;

        function censorKey(key) {
            if (!key) return '';
            var visible = Math.ceil(key.length * 2 / 6);
            if (visible >= key.length) return '•'.repeat(key.length);
            return key.slice(0, visible) + '•'.repeat(key.length - visible);
        }

        function copyTextToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                return navigator.clipboard.writeText(text);
            }
            return new Promise(function (resolve, reject) {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                try {
                    document.execCommand('copy');
                    resolve();
                } catch (err) {
                    reject(err);
                }
                document.body.removeChild(ta);
            });
        }

        function showTableTooltip(text, target, side) {
            tableTooltip.textContent = text;
            placeTooltip(registerTooltipAnchor(tableTooltip, target, 'table', side));
        }

        function hideTableTooltip() {
            tableTooltip.hidden = true;
            unregisterTooltipAnchor(tableTooltip);
        }

        var tooltipAnchors = [];

        function registerTooltipAnchor(el, target, kind, side) {
            tooltipAnchors = tooltipAnchors.filter(function (a) { return a.el !== el; });
            var anchor = { el: el, target: target, kind: kind, side: side };
            tooltipAnchors.push(anchor);
            return anchor;
        }

        function unregisterTooltipAnchor(el) {
            tooltipAnchors = tooltipAnchors.filter(function (a) { return a.el !== el; });
        }

        function getTooltipPosition(a) {
            var r = a.target.getBoundingClientRect();
            var tr = a.el.getBoundingClientRect();
            if (a.kind === 'error') {
                if (a.side === 'right') {
                    return { left: r.right - tr.width, top: r.top - tr.height - 8 };
                }
                return { left: r.left + r.width / 2 - tr.width / 2, top: r.top - tr.height - 8 };
            }
            if (a.kind === 'table') {
                var row = a.target.closest('tr');
                var rowRect = row ? row.getBoundingClientRect() : r;
                var top = rowRect.top + rowRect.height / 2 - tr.height / 2;
                var left;
                if (a.side === 'left') {
                    left = r.left - tr.width - 8;
                    if (left < 8) left = r.right + 8;
                } else {
                    left = r.right + 8;
                }
                return { left: left, top: top };
            }
            if (a.kind === 'plugin-search') {
                return { left: r.left - a.el.offsetWidth - 8, top: r.top + r.height / 2 - a.el.offsetHeight / 2 };
            }
            return { left: r.right + 8, top: r.top + r.height / 2 - tr.height / 2 };
        }

        function setTooltipVisible(el, visible, kind) {
            if (kind === 'plugin-search') {
                el.style.visibility = visible ? 'visible' : 'hidden';

            var confined = a.kind === 'error';
            if (viewEl && confined) {
                var targetRect = a.target.getBoundingClientRect();
                var v = viewEl.getBoundingClientRect();
                var inView = targetRect.right > v.left && targetRect.left < v.right && targetRect.bottom > v.top && targetRect.top < v.bottom;
                if (!inView) {
                    setTooltipVisible(a.el, false, a.kind);
                    return;
                }
            }
            setTooltipVisible(a.el, true, a.kind);
            var pos = getTooltipPosition(a);
            if (viewEl && confined) {
                var v2 = viewEl.getBoundingClientRect();
                var tooltipRect = a.el.getBoundingClientRect();
                pos.left = Math.max(v2.left, Math.min(pos.left, v2.right - tooltipRect.width));
                pos.top = Math.max(v2.top, Math.min(pos.top, v2.bottom - tooltipRect.height));
            }
            a.el.style.left = Math.round(pos.left) + 'px';
            a.el.style.top = Math.round(pos.top) + 'px';

        function addSharedVariable() {
            var nameInput = document.getElementById('sharedVariableNameInput');
            var typeDropdown = document.getElementById('sharedVariableTypeDropdown');
            var valueInput = document.getElementById('sharedVariableValueInput');
            var booleanDropdown = document.getElementById('sharedVariableBooleanDropdown');
            if (!nameInput || !typeDropdown || !valueInput || !booleanDropdown) return;

            var name = nameInput.value.trim();
            var type = getSoundDropdownValue(typeDropdown);

            if (!name) {
                showTransientError(nameInput, 'api-key-input-invalid', 'Name is required.');
                return;
            }
            if (PLAINTEXT_PROHIBITED_TEST_RE.test(name)) {
                flashSharedVariableInvalid(nameInput);
                showErrorTooltip(nameInput, 'Enter a valid name.');
                return;
            }
            if (isSharedVariableNameTaken(name)) {
                flashSharedVariableInvalid(nameInput);
                showErrorTooltip(nameInput, 'That name is already taken.');
                return;
            }
            if (!type) {
                showTransientError(getSoundDropdownButton(typeDropdown), 'api-key-input-invalid', 'Type is required.');
                return;
            }

            var value;
            if (type === 'boolean') {
                var booleanValue = getSoundDropdownValue(booleanDropdown);
                if (booleanValue === '') {
                    showTransientError(getSoundDropdownButton(booleanDropdown), 'api-key-input-invalid', 'Value is required.');
                    return;
                }
                value = booleanValue === 'true';
            } else {
                var rawValue = valueInput.value;
                if (rawValue === '') {
                    if (type === 'string') value = '';
                    else if (type === 'list') value = [];
                    else if (type === 'dictionary') value = {};
                    else {
                        showTransientError(valueInput, 'api-key-input-invalid', 'Value is required.');
                        return;
                    }
                } else {
                    try {
                        if (type === 'string') {
                            value = rawValue;
                        } else if (type === 'integer') {
                            if (!/^-?\d+$/.test(rawValue)) throw new Error('invalid integer');
                            value = parseInt(rawValue, 10);
                        } else if (type === 'float') {
                            if (!/^-?\d+(\.\d+)?$/.test(rawValue)) throw new Error('invalid float');
                            value = parseFloat(rawValue);
                        } else if (type === 'list' || type === 'dictionary') {
                            value = JSON.parse(rawValue);
                        } else {
                            value = rawValue;
                        }
                    } catch (e) {
                        flashSharedVariableInvalid(valueInput);
                        showErrorTooltip(valueInput, 'Invalid value for this type.');
                        return;
                    }
                }
                try {
                    validatePlaintextSharedValue(value);
                } catch (e) {
                    flashSharedVariableInvalid(valueInput);
                    showErrorTooltip(valueInput, 'Invalid character in value.');
                    return;
                }
            }

            fetchWithHandshake('/api/shared-memory', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, type: type, value: value })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.name === 'string') {
                        nameInput.value = '';
                        resetSoundDropdown(typeDropdown);
                        valueInput.value = '';
                        resetSoundDropdown(booleanDropdown);
                        updateSharedVariableInputs();
                        hideErrorTooltip();
                        loadSharedMemory();
                    }
                })
                .catch(function () {});
        }

        function serializeSharedValue(value, type) {
            if (type === 'boolean') return value ? 'true' : 'false';
            if (type === 'list' || type === 'dictionary') {
                try { return JSON.stringify(value); } catch (e) { return ''; }
            }
            if (value === '' || value == null) return '';
            return String(value);
        }

        function parseSharedValueInput(rawValue, type) {
            if (rawValue === '') {
                if (type === 'string') return '';
                if (type === 'list') return [];
                if (type === 'dictionary') return {};
                throw new Error('A value is required for this type.');
            }
            if (type === 'string') return rawValue;
            if (type === 'integer') {
                if (!/^-?\d+$/.test(rawValue)) throw new Error('Invalid integer value.');
                return parseInt(rawValue, 10);
            }
            if (type === 'float') {
                if (!/^-?\d+(\.\d+)?$/.test(rawValue)) throw new Error('Invalid float value.');
                return parseFloat(rawValue);
            }
            if (type === 'list' || type === 'dictionary') {
                return JSON.parse(rawValue);
            }
            throw new Error('Unknown type.');
        }

        function validatePlaintextSharedValue(value) {
            if (typeof value === 'string') {
                if (PLAINTEXT_PROHIBITED_TEST_RE.test(value)) throw new Error('Invalid character in value.');
                return;
            }
            if (Array.isArray(value)) {
                value.forEach(validatePlaintextSharedValue);
                return;
            }
            if (value && typeof value === 'object') {
                Object.keys(value).forEach(function (key) {
                    if (PLAINTEXT_PROHIBITED_TEST_RE.test(key)) throw new Error('Invalid character in value.');
                    validatePlaintextSharedValue(value[key]);
                });
            }
        }

        function buildInlineDropdown(options, selectedValue, onChange) {

            var menu = document.createElement('ul');

            options.forEach(function (opt) {
                if (opt.value === selectedValue) selectedLabel = opt.label;
                var li = document.createElement('li');
                li.className = 'sound-select-option' + (opt.value === selectedValue ? ' selected' : '');
                li.setAttribute('role', 'option');
                li.setAttribute('aria-selected', opt.value === selectedValue ? 'true' : 'false');
                li.setAttribute('data-value', opt.value);

                li.appendChild(label);
                li.appendChild(check);
                menu.appendChild(li);

            valueSpan.textContent = selectedLabel;

            btn.appendChild(valueSpan);

                    var t = row.dataset.type;

                    if (filtered !== before) {

                { value: 'float', label: 'float' },

            ], currentType, function (newType) {

            })

                    return r.json().catch(function () { return {}; }).then(function (data) {
                        return { ok: r.ok, data: data };
                    });
                })

        function isEventNameTaken(name) {
            if (!name) return false;
            var lower = String(name).trim().toLowerCase();
            return Object.keys(pluginEvents).some(function (k) { return k.toLowerCase() === lower; });
        }

        function isEventNameValid(name) {
            return typeof name === 'string' && name.trim() !== '' && !PLAINTEXT_PROHIBITED_TEST_RE.test(name);

            return typeof name === 'string' && name.trim() !== '' && !PLAINTEXT_PROHIBITED_TEST_RE.test(name);

            if (el._flashTimer) clearTimeout(el._flashTimer);

        function updateEventStreamingInputs() {
            var eventInput = document.getElementById('eventStreamingEventInput');
            var pluginInput = document.getElementById('eventStreamingPluginInput');
            var jsonInput = document.getElementById('eventStreamingJsonInput');
            var btn = document.getElementById('addEventStreamingBtn');
            if (!eventInput || !pluginInput || !btn) return;

            var isJsonMode = jsonInput && jsonInput.style.display !== 'none' && jsonInput.style.display !== '';
            var exportBtn = document.getElementById('exportEventStreamingBtn');
            var generator = document.getElementById('eventStreamingGenerator');
            if (isJsonMode) {
                btn.textContent = 'Import';
                btn.style.width = '80px';
                btn.style.minWidth = '80px';
                btn.style.maxWidth = '80px';
                btn.disabled = true;
                if (jsonInput) jsonInput.disabled = true;
                if (exportBtn) {
                    exportBtn.hidden = false;
                    exportBtn.disabled = true;
                }
                if (generator) generator.style.gridTemplateColumns = '1fr 1fr auto auto auto';
                return;
            }
            btn.style.width = '168px';
            btn.style.minWidth = '168px';
            btn.style.maxWidth = '168px';
            if (jsonInput) jsonInput.disabled = false;
            if (exportBtn) {
                exportBtn.hidden = true;
                exportBtn.disabled = false;
            }
            if (generator) generator.style.gridTemplateColumns = '1fr 1fr auto auto';

            var eventValue = getEventStreamingSelectedEvent();
            var isNewEvent = !!eventValue && !isEventNameTaken(eventValue);
            var isExistingEvent = !!eventValue && isEventNameTaken(eventValue);
            var eventValid = isEventNameValid(eventValue);

            // Second input (plugin name), both inputs fixed width, buttons auto
            // Plugin name input enabled logic: disabled as long as no event value or (if textual, no valid event)
            var pluginShouldBeEnabled = !!eventValue && eventValid;
            // Also check if event is new, need valid new event name, if existing, just need event selected
            if (!eventValue) {
                pluginShouldBeEnabled = false;
            } else if (!eventValid) {
                pluginShouldBeEnabled = false;
            }
            pluginInput.disabled = !pluginShouldBeEnabled;
            if (!pluginShouldBeEnabled) {
                // Don't clear plugin value, just disable
            }

            // Button text: Add Event if new event, Update Event if existing
            if (!eventValue) {
                btn.textContent = 'Add Event';
            } else if (isNewEvent) {
                btn.textContent = 'Add Event';
            } else if (isExistingEvent) {
                btn.textContent = 'Update Event';
            } else {
                btn.textContent = 'Add Event';
            }
            btn.disabled = false;

            // Visual invalid for event input
            var taken = isEventNameTaken(eventValue);
            // For new event, if event name is taken, it's actually not new, it's existing, so we handle via button text
            // But for validation, if the event name is taken and we are in new event mode, it's not valid for Add Event
            // However, with permanent textual input, we don't have insert vs existing mode, we just have the event name value
            // The event name is valid if it matches prohibited chars check and not empty
            // For the purpose of enabling plugin input, we need eventValid
            if (eventValue && (!eventValid || (isNewEvent && taken))) {
                // For new event, if taken, it's invalid (duplicate)
                // For existing, taken is expected, so not invalid for the event input itself
                // But we should show invalid if the event name is invalid
                if (!eventValid) {
                    eventInput.classList.add('api-key-input-invalid');
                } else if (isNewEvent && taken) {
                    eventInput.classList.add('api-key-input-invalid');
                } else {
                    eventInput.classList.remove('api-key-input-invalid');
                }
            } else {
                // For existing event, the event name is valid even if taken (since it's existing)
                if (eventValue && !eventValid) {
                    eventInput.classList.add('api-key-input-invalid');
                } else {
                    eventInput.classList.remove('api-key-input-invalid');
                }
            }

            // Plugin input invalid - only visual for invalid chars, button not disabled
            var pluginValue = pluginInput.value.trim();
            var pluginValid = isPluginNameForEventValid(pluginValue);
            if (pluginValue && !pluginValid) {
                pluginInput.classList.add('api-key-input-invalid');
            } else {
                if (eventValue && pluginValue && pluginValid) {
                    var plugins = pluginEvents[eventValue] || [];
                    var duplicate = plugins.some(function (p) { return p.toLowerCase() === pluginValue.toLowerCase(); });
                    if (duplicate) {
                        pluginInput.classList.add('api-key-input-invalid');
                    } else {
                        pluginInput.classList.remove('api-key-input-invalid');
                    }
                } else {
                    if (!pluginValue || pluginValid) {
                        pluginInput.classList.remove('api-key-input-invalid');
                    }
                }
            }

            // Internal interactions check: disable if not enabled
            var internalInteractionsEnabled = true;
            try {
                var toggle = document.getElementById('internalInteractionsToggle');
                if (toggle) {
                    internalInteractionsEnabled = toggle.classList.contains('on');
                } else {
                    // Fallback to check card hidden
                    var card = document.getElementById('internalInteractionsCard');
                    if (card && card.hidden) internalInteractionsEnabled = false;
                }
            } catch (e) {}
            var randomBtn2 = document.getElementById('eventStreamingRandomBtn');
            if (!internalInteractionsEnabled) {
                eventInput.disabled = true;
                pluginInput.disabled = true;
                btn.disabled = true;
                if (randomBtn2) randomBtn2.disabled = true;
            } else {
                eventInput.disabled = false;
                if (randomBtn2) randomBtn2.disabled = false;
                // pluginInput disabled already handled above
            }
        }

        function wireEventStreamingGenerator() {
            var eventInput = document.getElementById('eventStreamingEventInput');
            var pluginInput = document.getElementById('eventStreamingPluginInput');
            var jsonInput = document.getElementById('eventStreamingJsonInput');
            var btn = document.getElementById('addEventStreamingBtn');
            var importBtn = document.getElementById('eventStreamingImportBtn');
            if (!eventInput || !pluginInput || !btn || !jsonInput || !importBtn) return;

            var isJsonMode = false;
            var importIconSvg = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><polyline points="7 9 12 13 17 9"/><line x1="12" y1="12" x2="12" y2="3"/></svg>';
            var xIconSvg = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';

                    updateEventStreamingInputs();

                }
                refreshImportButtonTooltip(importBtn);
                updateEventStreamingInputs();
            });

            eventInput.addEventListener('keydown', function (event) {
                if (event.key.length === 1 && PLAINTEXT_PROHIBITED_TEST_RE.test(event.key)) {
                    event.preventDefault();
                    flashEventStreamingInvalid(this);
                }
            });
            eventInput.addEventListener('input', function () {
                var before = this.value;
                var hadProhibited = PLAINTEXT_PROHIBITED_TEST_RE.test(before);
                this.value = this.value.replace(PLAINTEXT_PROHIBITED_RE, '');
                if (this.value !== before) {
                    // Prohibited char was present - flash red effect only (no tooltip, tooltip only on button press)
                    flashEventStreamingInvalid(this);
                }
                var taken = isEventNameTaken(this.value);
                if (taken) {
                    this.classList.add('api-key-input-invalid');
                } else {
                    this.classList.remove('api-key-input-invalid');
                    hideErrorTooltip();
                }
                updateEventStreamingInputs();
            });

            pluginInput.addEventListener('keydown', function (event) {
                if (event.key.length === 1 && PLAINTEXT_PROHIBITED_TEST_RE.test(event.key)) {
                    event.preventDefault();
                    flashEventStreamingInvalid(this);
                }
            });
            pluginInput.addEventListener('input', function () {
                var before = this.value;
                var hadProhibited = PLAINTEXT_PROHIBITED_TEST_RE.test(before);
                this.value = this.value.replace(PLAINTEXT_PROHIBITED_RE, '');
                if (this.value !== before) {
                    flashEventStreamingInvalid(this);
                }
                var valid = isPluginNameForEventValid(this.value);
                this.classList.toggle('api-key-input-invalid', !valid && !!this.value);
                if (!valid && !!this.value) {
                    showErrorTooltip(this, 'Invalid plugin name.');
                } else {
                    var eventValue = getEventStreamingSelectedEvent();
                    var plugins = pluginEvents[eventValue] || [];
                    var duplicate = plugins.some(function (p) { return p.toLowerCase() === this.value.trim().toLowerCase(); }.bind(this));
                    if (duplicate) {
                        showErrorTooltip(this, 'Plugin already in this event.');
                    } else {
                        hideErrorTooltip();
                    }
                }
                updateEventStreamingInputs();
            });

            btn.addEventListener('click', addOrUpdateEventStreaming);
            updateEventStreamingInputs();
        }

        function addOrUpdateEventStreaming() {
            var eventInput = document.getElementById('eventStreamingEventInput');
            var pluginInput = document.getElementById('eventStreamingPluginInput');
            var eventValue = eventInput ? eventInput.value.trim() : '';
            var pluginValue = pluginInput ? pluginInput.value.trim() : '';
            var isInsert = !!eventValue && !isEventNameTaken(eventValue);

            if (!eventValue) {
                showTransientError(eventInput, 'api-key-input-invalid', 'Event Name Required.');
                return;
            }
            if (!isEventNameValid(eventValue)) {
                flashEventStreamingInvalid(eventInput);
                showErrorTooltip(eventInput, 'Enter a valid event name.');
                return;
            }
            if (isInsert && isEventNameTaken(eventValue)) {
                flashEventStreamingInvalid(eventInput);
                showErrorTooltip(eventInput, 'That event name is already taken.');
                return;
            }
            if (!isInsert && !pluginValue) {
                showTransientError(pluginInput, 'api-key-input-invalid', 'Plugin Name Required.');
                return;
            }
            if (pluginValue && !isPluginNameForEventValid(pluginValue)) {
                flashEventStreamingInvalid(pluginInput);
                showErrorTooltip(pluginInput, 'Enter a valid plugin name.');
                return;
            }

            pluginEventsRequestId++;

            if (isInsert) {
                // Create new event
                fetchWithHandshake('/api/plugin-events', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event: eventValue, plugin: pluginValue || null })
                })
                .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
                .then(function (res) {
                    if (!res.ok) {
                        var msg = res.data.error || 'Failed to create event.';
                        showErrorTooltip(document.getElementById('eventStreamingEventInput'), msg);
                        return;
                    }
                    document.getElementById('eventStreamingEventInput').value = '';
                    document.getElementById('eventStreamingPluginInput').value = '';
                    hideErrorTooltip();
                    pluginEvents[eventValue] = Array.isArray(res.data.plugins) ? res.data.plugins : [];
                    renderEventStreamingTable(pluginEvents);
                    updateEventStreamingInputs();
                })
                .catch(function () {});
            } else {
                // Update existing event: add plugin
                fetchWithHandshake('/api/plugin-events/' + encodeURIComponent(eventValue) + '/plugins', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ plugin: pluginValue })
                })
                .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
                .then(function (res) {
                    if (!res.ok) {
                        showErrorTooltip(document.getElementById('eventStreamingPluginInput'), res.data.error || 'Failed to update event.');
                        return;
                    }
                    document.getElementById('eventStreamingPluginInput').value = '';
                    hideErrorTooltip();
                    if (!Array.isArray(pluginEvents[eventValue])) pluginEvents[eventValue] = [];
                    pluginEvents[eventValue].push(pluginValue);
                    pluginEvents[eventValue].sort(function (a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
                    renderEventStreamingTable(pluginEvents);
                    updateEventStreamingInputs();
                })
                .catch(function () {});
            }
        }

                    updateEventStreamingInputs();

                .catch(function () {});

        function deleteEvent(eventName, btn) {

            var wrap = row ? row.closest('.table-wrap') : null;
            var tbody = row ? row.closest('tbody') : null;

            overlay.style.top = Math.round(rect.top) + 'px';

            row.classList.add('table-row-deleting');

        function compareNetworkIps(a, b) {
            var pa = String(a).split('.');

            var len = Math.max(pa.length, pb.length);
            for (var i = 0; i < len; i++) {
                var na = parseInt(pa[i], 10);
                var nb = parseInt(pb[i], 10);
                if (isNaN(na) || isNaN(nb)) {
                    return String(a).localeCompare(String(b));
                }
                if (na !== nb) return na - nb;
            }
            return 0;
        }

            var excl = canonicalFirewallIp(excludeIp);
            return firewallList(direction).some(function (entry) {
                var existing = canonicalFirewallIp(entry.ip);

            });

        function finalizeFirewallRowEdit(direction, ip, row, btn) {
            var ipInput = row.querySelector('.external-interactions-ip-cell input');
            var noteInput = row.querySelector('.external-interactions-note-cell input');
            if (!ipInput) return;
            var value = ipInput.value.trim();
            if (!value) {
                showTransientError(ipInput, 'api-key-input-invalid', 'IP address is required.');
                return;
            }
            if (!isValidIp(value)) {
                flashFirewallInputRed(ipInput, function () { refreshFirewallIpInvalid(direction, ipInput, ip); });
                showErrorTooltip(ipInput, 'Enter a valid IP address.');
                return;
            }
            if (isFirewallIpDuplicate(direction, value, ip)) {
                flashFirewallInputRed(ipInput, function () { refreshFirewallIpInvalid(direction, ipInput, ip); });
                showErrorTooltip(ipInput, 'That IP is already in the list.');
                return;
            }
            if (value.indexOf(':') !== -1) {
                value = maximizeIpv6(value);
            }
            var payload = { new_ip: value };
            if (noteInput) {
                var note = noteInput.value;
                if (PLAINTEXT_PROHIBITED_TEST_RE.test(note)) {
                    flashFirewallInputRed(noteInput, function () { refreshFirewallNoteInvalid(noteInput); });
                    showErrorTooltip(noteInput, 'Note contains prohibited characters.');
                    return;

            var cfg = firewallTableConfig(direction);

                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
                .then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (data) {
                        return { ok: r.ok, data: data };
                    });

                .then(function (res) {

                        var target = (res.data && res.data.error && res.data.error.indexOf('IP') !== -1) ? ipInput : (noteInput || ipInput);
                        showErrorTooltip(target, (res.data && res.data.error) || 'Failed to update the entry.');
                        return;
                    }
                    var list = firewallList(direction).map(function (entry) {
                        return entry.ip === ip ? res.data : entry;

                    setFirewallList(direction, list);
                    hideErrorTooltip();
                    renderFirewallTable(direction, list);
                })
                .catch(function () {});
        }

        var firewallDragState = null;
        var firewallDropIndicator = null;

        function firewallClearDropIndicator() {
            if (firewallDropIndicator && firewallDropIndicator.parentNode) {
                firewallDropIndicator.parentNode.removeChild(firewallDropIndicator);
            }
            firewallDropIndicator = null;
        }

        function firewallCancelDrag() {
            var state = firewallDragState;
            firewallDragState = null;
            firewallClearDropIndicator();
            document.removeEventListener('dragover', firewallDocumentDragOver);
            if (state) {
                renderFirewallTable(state.direction, firewallList(state.direction));
            }
        }

        function firewallDocumentDragOver(event) {
            if (!firewallDragState) return;
            var cell = event.target && event.target.closest ? event.target.closest('.firewall-plugins-cell') : null;
            if (!cell) {
                if (event.dataTransfer) {
                    try { event.dataTransfer.dropEffect = 'none'; } catch (e) {}
                }
                firewallClearDropIndicator();
            }
        }

        function firewallTagDragStart(direction, ip, plugin, tag, event) {
            var rect = tag.getBoundingClientRect();
            if (event.dataTransfer) {
                try { event.dataTransfer.setData('text/plain', plugin); } catch (e) {}
                try { event.dataTransfer.effectAllowed = 'move'; } catch (e) {}
                try { event.dataTransfer.setDragImage(tag, event.clientX - rect.left, event.clientY - rect.top); } catch (e) {}
            }
            firewallDragState = { direction: direction, ip: ip, plugin: plugin, width: rect.width, height: rect.height };
            tag.classList.add('event-plugin-tag-dragging');
            // Hide after the drag image is captured so the tag stays visible at the cursor
            setTimeout(function () {
                if (!firewallDragState) return;
                var placeholder = document.createElement('span');
                placeholder.className = 'event-plugin-tag firewall-drop-source';
                placeholder.setAttribute('aria-hidden', 'true');
                placeholder.style.width = Math.round(firewallDragState.width) + 'px';
                placeholder.style.height = Math.round(firewallDragState.height) + 'px';
                tag.parentNode.insertBefore(placeholder, tag);
                tag.style.display = 'none';
            }, 0);
            document.addEventListener('dragover', firewallDocumentDragOver);
        }

        function firewallTagDragOver(direction, cell, event) {
            if (!firewallDragState) return;
            var box = cell.querySelector('.event-plugin-tags');
            if (!box) return;
            var row = cell.closest('tr');
            var targetIp = row ? row.dataset.ip : null;
            // Drops are only possible inside the same table on another entry:
            // anywhere else the operation is shown as disabled.
            if (firewallDragState.direction !== direction || firewallDragState.ip === targetIp) {
                if (event.dataTransfer) {
                    try { event.dataTransfer.dropEffect = 'none'; } catch (e) {}
                }
                firewallClearDropIndicator();
                return;
            }
            event.preventDefault();
            if (event.dataTransfer) {
                try { event.dataTransfer.dropEffect = 'move'; } catch (e) {}
            }
            if (!firewallDropIndicator) {
                firewallDropIndicator = document.createElement('span');
                firewallDropIndicator.className = 'event-plugin-tag firewall-drop-target';
                firewallDropIndicator.setAttribute('aria-hidden', 'true');
                firewallDropIndicator.style.width = Math.round(firewallDragState.width) + 'px';
                firewallDropIndicator.style.height = Math.round(firewallDragState.height) + 'px';
            }
            // The cloud is always sorted (akupara first, then alphabetical), so the
            // indicator goes where the tag will actually end up, not where hovered.
            var targetEntry = null;
            var list = firewallList(direction);
            for (var i = 0; i < list.length; i++) {
                if (list[i].ip === targetIp) { targetEntry = list[i]; break; }
            }
            var current = [];
            var tags = box.querySelectorAll('.event-plugin-tag');
            for (var j = 0; j < tags.length; j++) {
                var t = tags[j];
                if (t === firewallDropIndicator || t.style.display === 'none') continue;
                var lab = t.querySelector('.event-plugin-tag-label');
                current.push({ el: t, name: lab ? lab.textContent : '' });
            }
            var merged = sortedEntryPlugins(current.map(function (c) { return c.name; }).concat([firewallDragState.plugin]));
            var wanted = -1;
            for (var k = 0; k < merged.length; k++) {
                if (merged[k].toLowerCase() === firewallDragState.plugin.toLowerCase()) { wanted = k; break; }
            }
            if (targetEntry === null || wanted < 0) {
                // Fallback: position by hover when the entry cannot be resolved
                var placed = false;
                for (var m = 0; m < current.length; m++) {
                    var r = current[m].el.getBoundingClientRect();
                    if (event.clientX < r.left + r.width / 2) {
                        box.insertBefore(firewallDropIndicator, current[m].el);
                        placed = true;
                        break;
                    }
                }
                if (!placed) {
                    box.appendChild(firewallDropIndicator);
                }
                return;
            }
            if (wanted < current.length) {
                box.insertBefore(firewallDropIndicator, current[wanted].el);
            } else {
                box.appendChild(firewallDropIndicator);
            }
        }

        function firewallTagDrop(direction, cell, event) {
            if (!firewallDragState) return;
            event.preventDefault();
            var state = firewallDragState;
            var row = cell.closest('tr');
            var targetIp = row ? row.dataset.ip : null;
            firewallDragState = null;
            document.removeEventListener('dragover', firewallDocumentDragOver);
            firewallClearDropIndicator();
            if (!targetIp || state.direction !== direction || state.ip === targetIp) {
                renderFirewallTable(state.direction, firewallList(state.direction));
                return;
            }
            moveFirewallPlugin(state.direction, state.ip, direction, targetIp, state.plugin);
        }

        function moveFirewallPlugin(fromDirection, fromIp, toDirection, toIp, plugin) {
            var toCfg = firewallTableConfig(toDirection);
            var fromCfg = firewallTableConfig(fromDirection);
            var targetEntry = null;
            var targetList = firewallList(toDirection);
            for (var i = 0; i < targetList.length; i++) {
                if (targetList[i].ip === toIp) { targetEntry = targetList[i]; break; }
            }
            var present = targetEntry && (targetEntry.plugins || []).some(function (p) {
                return String(p).toLowerCase() === String(plugin).toLowerCase();
            });
            if (present) {
                loadFirewallIps(fromDirection);
                if (toDirection !== fromDirection) loadFirewallIps(toDirection);
                return;
            }
            fetchWithHandshake(toCfg.base + '/' + encodeURIComponent(toIp), {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ add_plugin: plugin })
            })
                .then(function (r) {
                    return r.json().catch(function () { return {}; }).then(function (data) {
                        return { ok: r.ok, data: data };
                    });
                })
                .then(function (res) {
                    if (!res.ok) {
                        loadFirewallIps(fromDirection);
                        if (toDirection !== fromDirection) loadFirewallIps(toDirection);
                        return;
                    }
                    fetchWithHandshake(fromCfg.base + '/' + encodeURIComponent(fromIp), {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ remove_plugin: plugin })
                    })
                        .then(function () {
                            loadFirewallIps(fromDirection);
                            if (toDirection !== fromDirection) loadFirewallIps(toDirection);
                        })
                        .catch(function () {
                            loadFirewallIps(fromDirection);
                            if (toDirection !== fromDirection) loadFirewallIps(toDirection);
                        });
                })
                .catch(function () {
                    loadFirewallIps(fromDirection);
                    if (toDirection !== fromDirection) loadFirewallIps(toDirection);
                });
        }

        function wireFirewallTable(direction) {
            var cfg = firewallTableConfig(direction);
            var table = document.getElementById(cfg.tableId);
            if (!table) return;
            table.addEventListener('click', function (event) {
                var noteCell = event.target.closest('.external-interactions-note-cell');

            });
            table.addEventListener('mouseout', function (event) {
                var el = event.target.closest('[data-table-tooltip]');
                if (!el) return;
                var to = event.relatedTarget;
                if (to && el.contains(to)) return;
                hideTableTooltip();
            });
            table.addEventListener('dragstart', function (event) {
                var tag = event.target.closest ? event.target.closest('.event-plugin-tag') : null;
                if (!tag || tag.classList.contains('firewall-drop-source') || tag.classList.contains('firewall-drop-target')) return;
                var row = tag.closest('tr');
                if (!row) return;
                var label = tag.querySelector('.event-plugin-tag-label');
                var plugin = label ? label.textContent : '';
                if (!plugin) return;
                firewallTagDragStart(direction, row.dataset.ip, plugin, tag, event);
            });
            table.addEventListener('dragover', function (event) {
                var cell = event.target.closest ? event.target.closest('.firewall-plugins-cell') : null;
                if (!cell) return;

        }

        function loadFirewallIps(direction) {

                    setFirewallList(direction, data[cfg.listKey].slice());
                    renderFirewallTable(direction, data[cfg.listKey]);
                })
                .catch(function () {});
        }

        function isValidIpv4(s) {
            if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(s)) return false;
            return s.split('.').every(function (octet) {
                return parseInt(octet, 10) <= 255;
            });
        }

        function isValidIpv6(s) {
            if (!s || s.length < 2 || !/^[0-9a-fA-F:.]+$/.test(s)) return false;
            var hasV4 = s.indexOf('.') !== -1;
            if (hasV4) {
                var v4match = s.match(/^([0-9a-fA-F:]*):(\d{1,3}(?:\.\d{1,3}){3})$/);
                if (!v4match || !isValidIpv4(v4match[2])) return false;
                s = v4match[1] + ':x';
            }
            if (s === '::') return true;
            var doubleColons = (s.match(/::/g) || []).length;
            if (doubleColons > 1) return false;
            var maxGroups = hasV4 ? 7 : 8;
            if (doubleColons === 1) {
                var parts = s.split('::');
                if (parts.length > 2) return false;
                var total = 0;
                for (var p = 0; p < 2; p++) {
                    var part = parts[p];
                    if (!part) continue;
                    if (part.charAt(0) === ':' || part.charAt(part.length - 1) === ':') return false;
                    var gs = part.split(':');
                    for (var g = 0; g < gs.length; g++) {
                        if (!/^[0-9a-fA-F]{1,4}$/.test(gs[g])) return false;
                        total++;
                    }
                }
                return total >= 1 && total < maxGroups;
            }
            var groups = s.split(':');
            if (groups.length !== maxGroups) return false;
            for (var i = 0; i < groups.length; i++) {
                if (!/^[0-9a-fA-F]{1,4}$/.test(groups[i])) return false;
            }
            return true;
        }

        function isValidIp(s) {
            s = String(s || '').trim();
            if (!s) return false;
            return s.indexOf('.') !== -1 ? isValidIpv4(s) : isValidIpv6(s);
        }

        function maximizeIpv6(ip) {
            ip = String(ip || '').trim().toLowerCase();
            var halves = ip.split('::');
            function groupsOf(part) {
                if (!part) return [];
                var out = [];
                var segs = part.split(':');
                for (var i = 0; i < segs.length; i++) {
                    if (segs[i].indexOf('.') !== -1) {
                        var hex = '';
                        var octs = segs[i].split('.');
                        for (var j = 0; j < octs.length; j++) {
                            hex += ('0' + parseInt(octs[j], 10).toString(16)).slice(-2);
                        }
                        out.push(hex.slice(0, 4), hex.slice(4));
                    } else {
                        out.push(('0000' + segs[i]).slice(-4));
                    }
                }
                return out;
            }
            var left = groupsOf(halves[0]);
            var right = halves.length > 1 ? groupsOf(halves[1]) : [];
            var zeros = 8 - left.length - right.length;
            var full = left.slice();
            for (var z = 0; z < zeros; z++) full.push('0000');
            return full.concat(right).join(':');
        }

        function wireUserRegistration() {
            var usernameInput = document.getElementById('registerUsernameInput');
            var passwordInput = document.getElementById('registerPasswordInput');
            var confirmInput = document.getElementById('registerConfirmInput');
            var registerBtn = document.getElementById('registerUserBtn');
            if (!usernameInput || !passwordInput || !confirmInput || !registerBtn) return;

            function refreshRegisterUsernameInvalid() {

                    return;
                }
                if (isUsernameTaken(username)) {

                    usernameInput.focus();
                    return;
                }
                if (!password) {

                    return;
                }
                if (!confirmInput.value) {

        function wireAccountSection() {
            var currentInput = document.getElementById('currentPasswordInput');
            var newInput = document.getElementById('newPasswordInput');
            var confirmInput = document.getElementById('confirmPasswordInput');
            var changeBtn = document.getElementById('changePasswordBtn');
            if (!currentInput || !newInput || !confirmInput || !changeBtn) return;

            var SALT = 'akupara-salt';
            var PARAMS = { time: 2, mem: 65536, hashLen: 32, parallelism: 1, type: argon2.ArgonType.Argon2id };
            var busy = false;

            function hashPassword(password) {
                var options = { pass: password, salt: SALT };
                for (var key in PARAMS) options[key] = PARAMS[key];
                return argon2.hash(options).then(function (result) {
                    return result.encoded;
                });
            }

            function markInvalid(input, invalid) {
                input.classList.toggle('account-password-input-invalid', invalid);
            }

            function syncChaining() {
                var currentHas = currentInput.value.length > 0;
                var newHas = newInput.value.length > 0;
                if (!currentHas) newInput.value = '';
                newInput.disabled = busy || !currentHas;
                if (!currentHas || !newHas) confirmInput.value = '';
                confirmInput.disabled = busy || !currentHas || !newHas;
                changeBtn.disabled = busy;
            }

            currentInput.addEventListener('input', function () {
                newInput.value = '';
                confirmInput.value = '';
                markInvalid(currentInput, false);
                markInvalid(newInput, false);
                markInvalid(confirmInput, false);
                hideErrorTooltip();
                syncChaining();
            });
            newInput.addEventListener('input', function () {
                markInvalid(newInput, false);
                hideErrorTooltip();
                syncChaining();
            });
            confirmInput.addEventListener('input', function () {
                markInvalid(confirmInput, false);
                hideErrorTooltip();
                syncChaining();
            });

            changeBtn.addEventListener('click', function () {
                if (busy) return;
                markInvalid(currentInput, false);
                markInvalid(newInput, false);
                markInvalid(confirmInput, false);
                if (!currentInput.value) {
                    showTransientError(currentInput, 'account-password-input-invalid', 'Current password is required.');
                    currentInput.focus();
                    return;
                }
                if (!newInput.value) {
                    showTransientError(newInput, 'account-password-input-invalid', 'New password is required.');
                    newInput.focus();
                    return;
                }
                if (!confirmInput.value) {
                    showTransientError(confirmInput, 'account-password-input-invalid', 'Confirmation is required.');
                    confirmInput.focus();
                    return;
                }
                if (newInput.value !== confirmInput.value) {
                    markInvalid(confirmInput, true);
                    showErrorTooltip(confirmInput, 'Passwords do not match.');
                    confirmInput.focus();
                    return;
                }
                busy = true;
                syncChaining();
                Promise.all([hashPassword(currentInput.value), hashPassword(newInput.value)])
                    .then(function (hashes) {
                        return fetchWithHandshake('/api/change-password', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ current_password_hash: hashes[0], new_password_hash: hashes[1] })
                        });
                    })
                    .then(function (r) {
                        return r.json().catch(function () { return {}; }).then(function (data) {
                            return { status: r.status, data: data };
                        });
                    })
                    .then(function (res) {
                        busy = false;
                        if (res.status === 200) {
                            currentInput.value = '';
                            newInput.value = '';
                            confirmInput.value = '';
                            markInvalid(currentInput, false);
                            markInvalid(newInput, false);
                            markInvalid(confirmInput, false);
                            hideErrorTooltip();
                        } else if (res.status === 403) {
                            markInvalid(currentInput, true);
                            showErrorTooltip(currentInput, 'Current password is incorrect.');
                            currentInput.focus();
                        }
                        syncChaining();
                    })
                    .catch(function () {
                        busy = false;
                        syncChaining();
                    });
            });

            syncChaining();
        }

            var lock = toggle.querySelector('.toggle-lock');

            if (value) {
                lockFrom = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
                lockTo = { opacity: '0', transform: 'scale(0.3) rotate(45deg)' };
                openFrom = { opacity: '0', transform: 'scale(0.3) rotate(-45deg)' };
                openTo = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
            } else {
                lockFrom = { opacity: '0', transform: 'scale(0.3) rotate(45deg)' };
                lockTo = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
                openFrom = { opacity: '1', transform: 'scale(1) rotate(0deg)' };
                openTo = { opacity: '0', transform: 'scale(0.3) rotate(-45deg)' };
            }
            var opts = { duration: 300, easing: 'ease', fill: 'forwards' };
            if (lock.getAnimations) lock.getAnimations().forEach(function (a) { a.cancel(); });
            if (open.getAnimations) open.getAnimations().forEach(function (a) { a.cancel(); });
            lock.animate([lockFrom, lockTo], opts);
            open.animate([openFrom, openTo], opts);
        }
