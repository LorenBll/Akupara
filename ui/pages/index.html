        function createCardIndicator(card) {
            var el = document.createElement('span');
            el.className = 'card-indicator';
            var titleEl = card.querySelector('h3');
            var svg = titleEl ? titleEl.querySelector('svg') : null;
            if (svg) {
                el.appendChild(svg.cloneNode(true));
            } else {
                var dot = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                dot.setAttribute('viewBox', '0 0 24 24');
                dot.setAttribute('width', '14');
                dot.setAttribute('height', '14');
                dot.setAttribute('fill', 'currentColor');
                var circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', '12');
                circle.setAttribute('cy', '12');
                circle.setAttribute('r', '4');
                dot.appendChild(circle);
                el.appendChild(dot);
            }
            var label = document.createElement('span');
            label.className = 'card-indicator-title';
            label.textContent = titleEl ? titleEl.textContent.replace(/\s+/g, ' ').trim() : (card.id || 'Card');
            el.appendChild(label);
            el.addEventListener('click', function () { scrollToCard(el._card); });
            card._indicator = el;
            el._card = card;
            return el;
        }

        function indicatorForCard(card) {
            return card._indicator || null;
        }

        function buildCardIndicators() {
            var list = getCardIndicatorList();
            list.innerHTML = '';
            var cards = viewEl.querySelectorAll('.page-card');
            for (var i = 0; i < cards.length; i++) {
                if (cards[i].hidden) { cards[i]._indicator = null; continue; }
                list.appendChild(createCardIndicator(cards[i]));
            }
            positionCardIndicators();
        }

        function cardIndicatorSync() {
            var list = getCardIndicatorList();
            var cards = viewEl.querySelectorAll('.page-card');
            var cur = [];
            for (var i = 0; i < cards.length; i++) {
                if (!cards[i].hidden) cur.push(cards[i]);
            }
            var items = list.children;
            var same = items.length === cur.length;
            if (same) {
                for (var j = 0; j < items.length; j++) {
                    if (items[j]._card !== cur[j]) { same = false; break; }
                }
            }
            if (!same) buildCardIndicators();
        }

        function cardIndicatorAppear(card) {
            var list = getCardIndicatorList();
            if (indicatorForCard(card)) return;
            var el = createCardIndicator(card);
            var ref = null;
            var cards = viewEl.querySelectorAll('.page-card');
            var seen = false;
            for (var i = 0; i < cards.length; i++) {
                if (cards[i] === card) { seen = true; continue; }
                if (cards[i].hidden) continue;
                if (seen && cards[i]._indicator) { ref = cards[i]._indicator; break; }
            }
            var before = [];
            var items = list.children;
            for (var j = 0; j < items.length; j++) {
                before.push(items[j].getBoundingClientRect().top);
            }
            if (ref) list.insertBefore(el, ref); else list.appendChild(el);
            positionCardIndicators();
            el.style.opacity = '0';
            if (before.length) {
                var ai = 0;
                var newItems = list.children;
                for (var n = 0; n < newItems.length; n++) {
                    if (newItems[n] === el) continue;
                    var d = before[ai] - newItems[n].getBoundingClientRect().top;
                    ai++;
                    if (!d) continue;
                    newItems[n].animate([{ transform: 'translateY(' + d + 'px)' }, { transform: 'translateY(0px)' }], { duration: 300, easing: 'ease', fill: 'backwards' });
                }
                setTimeout(function () { showCardIndicator(el); }, 300);
            } else {
                showCardIndicator(el);
            }
        }

        function showCardIndicator(el) {
            el.style.opacity = '';
            el.animate([
                { opacity: '0', transform: 'translateX(24px)' },
                { opacity: '1', transform: 'translateX(0px)' }
            ], { duration: 200, easing: 'ease', fill: 'backwards' });
        }

        function cardIndicatorVanish(card) {
            var list = getCardIndicatorList();
            var el = indicatorForCard(card);
            if (!list || !el) return;
            el.animate([
                { opacity: '1', transform: 'translateX(0px)' },
                { opacity: '0', transform: 'translateX(24px)' }
            ], { duration: 300, easing: 'ease', fill: 'forwards' });
            setTimeout(function () {
                var before = [];
                for (var j = 0; j < list.children.length; j++) {
                    before.push({ el: list.children[j], top: list.children[j].getBoundingClientRect().top });
                }
                if (el.parentNode) el.parentNode.removeChild(el);
                if (card._indicator === el) card._indicator = null;
                positionCardIndicators();
                var rest = list.children;
                for (var i = 0; i < rest.length; i++) {
                    var b = null;
                    for (var k = 0; k < before.length; k++) {
                        if (before[k].el === rest[i]) { b = before[k].top; break; }
                    }
                    if (b === null) continue;
                    var d = b - rest[i].getBoundingClientRect().top;
                    if (!d) continue;
                    rest[i].animate([{ transform: 'translateY(' + d + 'px)' }, { transform: 'translateY(0px)' }], { duration: 300, easing: 'ease', fill: 'backwards' });
                }
            }, 300);
        }

        function animateCardIndicatorsOut() {
            var list = getCardIndicatorList();
            var items = list.children;
            for (var i = 0; i < items.length; i++) {
                items[i].animate([
                    { opacity: '1', transform: 'translateX(0px)' },
                    { opacity: '0', transform: 'translateX(24px)' }
                ], { duration: 200, easing: 'ease', fill: 'forwards' });
            }
        }

        function animateCardIndicatorsIn(delayMs) {
            delayMs = delayMs || 0;
            var list = getCardIndicatorList();
            var items = list.children;
            for (var i = 0; i < items.length; i++) {
                items[i].animate([
                    { opacity: '0', transform: 'translateX(24px)' },
                    { opacity: '1', transform: 'translateX(0px)' }
                ], { duration: 300, easing: 'ease', delay: delayMs + i * 40, fill: 'backwards' });
            }
        }

        function scrollToCard(card) {
            if (!card || !viewEl) return;
            var target = card.getBoundingClientRect().top - viewEl.getBoundingClientRect().top + viewEl.scrollTop;
            viewEl.scrollTo({ top: target, behavior: 'smooth' });
        }

        function toggleApiKeysEnabled() {
            var toggle = document.getElementById('apiKeysEnabledToggle');
            if (!toggle || settingsPending) return;
            settingsPending = true;
            var next = !toggle.classList.contains('on');
            var previous = !next;
            updateApiKeysEnabled(next, true);
            fetchWithHandshake('/api/api-keys-enabled', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ apiKeysEnabled: next })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.apiKeysEnabled === 'boolean') {
                        updateApiKeysEnabled(data.apiKeysEnabled, true);
                    }
                })
                .catch(function () {
                    updateApiKeysEnabled(previous, false);
                })
                .then(function () {
                    settingsPending = false;
                    if (!sliderTooltip.hidden && hoveredToggle) {
                        showSliderTooltip(hoveredToggle);
                    }
                });
        }

        function toggleDisplayPromotion() {
            var toggle = document.getElementById('displayPromotionToggle');
            if (!toggle || settingsPending) return;
            settingsPending = true;
            var next = !toggle.classList.contains('on');
            var previous = !next;
            updateDisplayPromotion(next);
            setPromotionVisible(next);
            sendSetting({ displayPromotion: next }, function () {
                updateDisplayPromotion(previous);
                setPromotionVisible(previous);
            });
        }

        function togglePlayAudios() {
            var toggle = document.getElementById('playAudiosToggle');
            if (!toggle || settingsPending) return;
            settingsPending = true;
            var next = !toggle.classList.contains('on');
            var previous = !next;
            updatePlayAudios(next);
            fetchWithHandshake('/api/audio', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ playAudios: next })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.playAudios === 'boolean') {
                        updatePlayAudios(data.playAudios);
                    }
                })
                .catch(function () {
                    updatePlayAudios(previous);
                })
                .then(function () {
                    settingsPending = false;
                    if (!sliderTooltip.hidden && hoveredToggle) {
                        showSliderTooltip(hoveredToggle);
                    }
                });
        }

        function toggleSharedMemoryEnabled() {
            var toggle = document.getElementById('sharedMemoryEnabledToggle');
            if (!toggle || settingsPending) return;
            settingsPending = true;
            var next = !toggle.classList.contains('on');
            var previous = !next;
            updateSharedMemoryEnabled(next);
            fetchWithHandshake('/api/shared-memory-enabled', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sharedMemoryEnabled: next })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data && typeof data.sharedMemoryEnabled === 'boolean') {
                        updateSharedMemoryEnabled(data.sharedMemoryEnabled);
                    }
                })
                .catch(function () {
                    updateSharedMemoryEnabled(previous);
                })
                .then(function () {
                    settingsPending = false;
                    if (!sliderTooltip.hidden && hoveredToggle) {
                        showSliderTooltip(hoveredToggle);
                    }
                });
        }

        var sliderTooltip = document.getElementById('sliderTooltip');
        var hoveredToggle = null;

        function showSliderTooltip(toggle) {
            hoveredToggle = toggle;
            var rect = toggle.getBoundingClientRect();
            var onText = toggle.getAttribute('data-tooltip-on') || 'On';
            var offText = toggle.getAttribute('data-tooltip-off') || 'Off';
            sliderTooltip.textContent = 'Currently Set to: ' + (toggle.classList.contains('on') ? onText : offText);
            sliderTooltip.hidden = false;
            var tooltipRect = sliderTooltip.getBoundingClientRect();
            sliderTooltip.style.left = Math.round(rect.right + 8) + 'px';
            sliderTooltip.style.top = Math.round(rect.top + rect.height / 2 - tooltipRect.height / 2) + 'px';
        }

        function hideSliderTooltip() {
            hoveredToggle = null;
            sliderTooltip.hidden = true;
        }

        function wireToggleTooltips() {
            var toggles = document.querySelectorAll('.toggle');
            Array.prototype.forEach.call(toggles, function (toggle) {
                if (toggle.getAttribute('data-tooltip-wired')) return;
                toggle.setAttribute('data-tooltip-wired', '1');
                toggle.addEventListener('mouseenter', function () { showSliderTooltip(toggle); });
                toggle.addEventListener('mouseleave', hideSliderTooltip);
            });
        }

        var sectionTooltip = document.getElementById('sectionTooltip');

        function showSectionTooltip(chevron) {
            if (!sectionTooltip) return;
            var expanded = chevron.classList.contains('expanded');
            sectionTooltip.textContent = expanded ? 'Collapse' : 'Expand';
            sectionTooltip.hidden = false;
            var rect = chevron.getBoundingClientRect();
            var tooltipRect = sectionTooltip.getBoundingClientRect();
            sectionTooltip.style.left = Math.round(rect.right + 8) + 'px';
            sectionTooltip.style.top = Math.round(rect.top + rect.height / 2 - tooltipRect.height / 2) + 'px';
        }

        function hideSectionTooltip() {
            if (!sectionTooltip) return;
            sectionTooltip.hidden = true;
        }

        function wireSoundDropdowns() {
            var dropdowns = document.querySelectorAll('.sound-dropdown');
            Array.prototype.forEach.call(dropdowns, function (dropdown) {
                if (dropdown.getAttribute('data-wired')) return;
                dropdown.setAttribute('data-wired', '1');
                var btn = dropdown.querySelector('.sound-select');
                var menu = dropdown.querySelector('.sound-select-menu');
                btn.addEventListener('click', function (event) {
                    event.stopPropagation();
                    if (btn.disabled) return;
                    var willOpen = !menu.classList.contains('open');
                    closeAllSoundDropdowns();
                    if (willOpen) {
                        menu.classList.add('open');
                        btn.classList.add('open');
                        btn.setAttribute('aria-expanded', 'true');
                    }
                });
                menu.addEventListener('click', function (event) {
                    event.stopPropagation();
                    var option = event.target.closest('.sound-select-option');
                    if (option) {
                        selectSoundOption(dropdown, option);
                    }
                    menu.classList.remove('open');
                    btn.classList.remove('open');
                    btn.setAttribute('aria-expanded', 'false');
                });
            });
        }

        function selectSoundOption(dropdown, option) {
            var menu = dropdown.querySelector('.sound-select-menu');
            var btn = dropdown.querySelector('.sound-select');
            Array.prototype.forEach.call(menu.querySelectorAll('.sound-select-option'), function (o) {
                o.classList.remove('selected');
                o.setAttribute('aria-selected', 'false');
            });
            option.classList.add('selected');
            option.setAttribute('aria-selected', 'true');
            var label = option.querySelector('.sound-select-option-label');
            var value = btn.querySelector('.sound-select-value');
            var optionValue = option.getAttribute('data-value') || '';
            if (label && value) {
                value.textContent = label.textContent;
                value.setAttribute('data-value', optionValue);
            }
            if (dropdown._onSelect) {
                dropdown._onSelect(optionValue);
            }
        }

        function getSoundDropdownValue(dropdown) {
            var value = dropdown.querySelector('.sound-select-value');
            return value ? (value.getAttribute('data-value') || '') : '';
        }

        function getSoundDropdownButton(dropdown) {
            return dropdown.querySelector('.sound-select');
        }

        function resetSoundDropdown(dropdown) {
            var option = dropdown.querySelector('.sound-select-option[data-value=""]');
            if (option) {
                selectSoundOption(dropdown, option);
            }
        }

        function closeAllSoundDropdowns() {
            var menus = document.querySelectorAll('.sound-select-menu');
            Array.prototype.forEach.call(menus, function (menu) {
                menu.classList.remove('open');
                var dropdown = menu.closest('.sound-dropdown');
                if (dropdown) {
                    var btn = dropdown.querySelector('.sound-select');
                    if (btn) {
                        btn.classList.remove('open');
                        btn.setAttribute('aria-expanded', 'false');
                    }
                }
            });
        }

        document.addEventListener('click', closeAllSoundDropdowns);

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && document.activeElement) {
                document.activeElement.blur();
            }
        });

        viewEl.addEventListener('scroll', function () {
            if (!sliderTooltip.hidden && hoveredToggle) {
                showSliderTooltip(hoveredToggle);
            }
        });

        viewEl.addEventListener('click', function (event) {
            if (event.target.closest('#generateApiKeyBtn')) {
                generateApiKey();
                return;
            }
            if (event.target.closest('#randomNameBtn')) {
                randomizeApiKeyName();
                return;
            }
            var actionBtn = event.target.closest('.page-action-btn');
            if (actionBtn) {
                var action = actionBtn.getAttribute('data-action');
                if (action === 'terminate') {
                    postAction('/api/terminate');
                } else if (action === 'restart') {
                    postAction('/api/restart');
                }
                return;
            }
            var toggle = event.target.closest('.toggle');
            if (toggle) {
                if (toggle.id === 'apiKeysEnabledToggle') {
                    toggleApiKeysEnabled();
                } else if (toggle.id === 'displayPromotionToggle') {
                    toggleDisplayPromotion();
                } else if (toggle.id === 'playAudiosToggle') {
                    togglePlayAudios();
                } else if (toggle.id === 'sharedMemoryEnabledToggle') {
                    toggleSharedMemoryEnabled();
                } else if (toggle.id === 'externalInteractionsToggle') {
                    toggleExternalInteractions();
                } else if (toggle.id === 'networkAccessAllowNewToggle') {
                    toggleNetworkAccessAllowNew();
                } else if (toggle.id === 'internalInteractionsToggle') {
                    toggleInternalInteractions();
                } else if (toggle.id === 'automaticUpdateToggle') {
                    toggleAutomaticUpdate();
                }
            }
        });

        function setPromotionVisible(show) {
            var footer = document.getElementById('pageFooter');
            if (!footer) return;
            if (show) {
                footer.classList.add('visible');
            } else {
                footer.classList.remove('visible');
            }
        }

        function syncPromotion() {
            fetchWithHandshake('/api/settings')
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (data && typeof data.displayPromotion === 'boolean') {
                        setPromotionVisible(data.displayPromotion);
                    }
                })
                .catch(function () {});
        }

        function syncSession() {
            if (currentPage !== 'settings') return;
            fetchWithHandshake('/api/session')
                .then(function (r) { return r.ok ? r.json() : null; })
                .then(function (data) {
                    if (!data || typeof data.username !== 'string' || typeof data.admin !== 'boolean') return;
                    var adminChanged = data.admin !== lastSessionAdmin;
                    if (adminChanged) {
                        lastSessionAdmin = data.admin;
                        loadPage('settings');
                        return;
                    }
                    if (data.username !== currentUsername) {
                        currentUsername = data.username;
                        var accountValue = document.getElementById('accountUsernameValue');
                        if (accountValue) accountValue.textContent = data.username;
                        rebuildRegisteredUsernames();
                        loadUsers();
                    }
                })
                .catch(function () {});
        }

        loadPage('home');
        syncPromotion();
        setInterval(syncPromotion, 3000);
        setInterval(syncSession, 3000);
    </script>
</body>
